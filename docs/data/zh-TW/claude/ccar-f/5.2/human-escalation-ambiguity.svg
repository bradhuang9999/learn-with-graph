<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1220" role="img" aria-label="客戶支援代理的逐題分流與人工決定回注閉環">
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#173447}.title{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#577080}.h{font-size:23px;font-weight:700}.body{font-size:19px}.note{font-size:16px}.tiny{font-size:15px}.section-bg{fill:#f4f8f9;stroke:#d2e3e6;stroke-width:2}.card-bg{fill:#fff;stroke:#adced5;stroke-width:2}.flow-line{fill:none;stroke:#247d90;stroke-width:3;marker-end:url(#arrow)}.return{fill:none;stroke:#b36a35;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#orange-arrow);animation:flow 2.4s linear infinite}.red{fill:#fff0ed;stroke:#d88679}.yellow{fill:#fff5de;stroke:#d5b269}.green{fill:#e7f4ed;stroke:#72b58d}.blue{fill:#e8f3f6}.accent{fill:#08667b;font-weight:700}.danger{fill:#a34434;font-weight:700}.muted{fill:#5d7580}@keyframes flow{to{stroke-dashoffset:-36}}@media(prefers-reduced-motion:reduce){.return{animation:none}}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#247d90"/></marker><marker id="orange-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b36a35"/></marker></defs>
<rect width="1440" height="1220" style="fill:#fff;"/><text x="52" y="64" class="title">5.2　先問權限與身分，再看是否能推進</text><text x="52" y="101" class="subtitle">「很失望」不是人工要求；「我要真人」也不必先被代理說服。高自評信心不能取代身分驗證。</text>
<g id="section-decision" class="section"><rect class="section-bg" x="42" y="132" width="1356" height="687" rx="24"/><g class="section-content"><text x="70" y="174" class="h">逐題分流：三個問題，三種不同處置</text><text x="70" y="205" class="note muted">每列右側是「是」的處置；「否」才進下一題。若任何時候明確要求人工，回到第一題立即交接。</text>
<path class="flow-line" d="M641 312H767"/><path class="flow-line" d="M386 363V420"/><path class="flow-line" d="M641 508H767"/><path class="flow-line" d="M386 559V616"/><path class="flow-line" d="M641 704H767"/><path class="flow-line" d="M386 755V775"/>
<text x="687" y="296" class="tiny accent">是</text><text x="394" y="398" class="tiny muted">否</text><text x="687" y="492" class="tiny accent">是</text><text x="394" y="594" class="tiny muted">否</text><text x="687" y="688" class="tiny accent">是</text><text x="404" y="775" class="tiny muted">否</text>
<g id="concept-q-human" class="concept-card flow-node" data-title="一、明確人工要求或無權決定" data-detail="客戶要求真人、政策空白或例外、無法繼續推進皆屬交接條件；明確人工要求不可先自行調查。"><rect class="card-bg" x="70" y="236" width="571" height="127" rx="16"/><g class="card-content"><text x="93" y="273" class="h">① 要真人，或政策無授權？</text><text x="93" y="310" class="body">硬觸發：條件成立就交接</text><text x="93" y="339" class="tiny muted">例如「請真人處理」／競品價差不在政策內</text></g></g>
<g id="concept-human" class="concept-card flow-node" data-title="立即交人工" data-detail="記錄原話、事實、已查行動和待決問題；不可逆操作暫停，協調者路由到有權者。"><rect class="card-bg red" x="767" y="236" width="601" height="127" rx="16"/><g class="card-content"><text x="791" y="273" class="h danger">立即交接人工</text><text x="791" y="310" class="body">不用先調查「代理能否自己處理」</text><text x="791" y="339" class="tiny muted">待審停退款；使用下方結構化交接流程</text></g></g>
<g id="concept-q-identity" class="concept-card flow-node" data-title="二、身分或目標有歧義" data-detail="多筆同名客戶或訂單時，不能以時間、名稱或模型信心挑一筆；詢問最少必要識別資訊。"><rect class="card-bg" x="70" y="432" width="571" height="127" rx="16"/><g class="card-content"><text x="93" y="469" class="h">② 查到多筆可能的客戶？</text><text x="93" y="506" class="body">這是身分歧義，不是猜測題</text><text x="93" y="535" class="tiny muted">日期較近或「95% 把握」都不能直接選</text></g></g>
<g id="concept-clarify" class="concept-card flow-node" data-title="先釐清識別資訊" data-detail="請客戶提供最少且適當的識別資訊，依既定驗證流程查詢；無法核實則使用下方同一結構化交接入口轉人工驗證，不暴露候選人資料。"><rect class="card-bg yellow" x="767" y="432" width="601" height="127" rx="16"/><g class="card-content"><text x="791" y="469" class="h">先釐清，不挑一筆</text><text x="791" y="506" class="body">問最少識別資訊，再按流程驗證</text><text x="791" y="535" class="tiny muted">無法核實 → 使用下方同一交接入口</text></g></g>
<g id="concept-q-progress" class="concept-card flow-node" data-title="三、能否有意義推進" data-detail="政策明確且工具可用，顧客雖挫折仍可先表示理解並處理；不能推進時停止無效嘗試並交人工。"><rect class="card-bg" x="70" y="628" width="571" height="127" rx="16"/><g class="card-content"><text x="93" y="665" class="h">③ 仍可在授權範圍內推進？</text><text x="93" y="702" class="body">看政策與工具，不看情緒或自評信心</text><text x="93" y="731" class="tiny muted">無進展不能一直重試</text></g></g>
<g id="concept-solve" class="concept-card flow-node" data-title="先處理並保留人工選項" data-detail="承認不便，依政策與工具處理；保留人工選項，客戶再次明確要求真人時立即交接。"><rect class="card-bg green" x="767" y="628" width="601" height="127" rx="16"/><g class="card-content"><text x="791" y="665" class="h">先處理，保留人工選項</text><text x="791" y="702" class="body">「很煩，請查物流」→ 表示理解並查詢</text><text x="791" y="731" class="tiny muted">再次要求真人，立即轉交</text></g></g>
<g id="concept-no-progress" class="concept-card flow-node" data-title="無法推進則交接" data-detail="第三題答案為否時，停止無效嘗試，走與明確人工要求及無法核實身分相同的結構化交接流程。"><rect class="card-bg red" x="70" y="777" width="571" height="36" rx="10"/><g class="card-content"><text x="93" y="802" class="note danger">否／無法推進 → 使用下方結構化交接流程</text></g></g>
</g></g>
<g id="section-handoff" class="section"><rect class="section-bg" x="42" y="844" width="1356" height="322" rx="24"/><g class="section-content"><text x="70" y="884" class="h">同一交接入口：①直接要求　②驗證失敗　③無法推進</text>
<path class="flow-line" d="M359 1015H405"/><path class="flow-line" d="M704 1015H753"/><path class="return" d="M1042 1015H1088"/><text x="1047" y="994" class="tiny" style="fill:#a9652e;">回寫</text>
<g id="concept-packet" class="concept-card flow-node" data-title="結構化求助封包" data-detail="以 request_review 或 escalate 概念工具提交四項：脈絡、觸發原文、已試行動與結果、待決問題及建議下一步；這不是固定 SDK API。"><rect class="card-bg blue" x="70" y="916" width="289" height="175" rx="16"/><g class="card-content"><text x="91" y="954" class="h accent">結構化求助</text><text x="91" y="989" class="body">原話＋已查＋待決</text><text x="91" y="1018" class="note">建議下一步 ≠ 授權</text><text x="91" y="1050" class="tiny muted">不是自由文字說「我要升級」</text></g></g>
<g id="concept-route" class="concept-card flow-node" data-title="協調者路由與待審" data-detail="協調者依觸發類型與權限路由到人工，保留觸發類型、目的地與結果；不可逆動作在審查前暫停，逾時不自動通過。"><rect class="card-bg" x="405" y="916" width="299" height="175" rx="16"/><g class="card-content"><text x="426" y="954" class="h accent">協調者路由</text><text x="426" y="989" class="body">依權限送人工佇列</text><text x="426" y="1018" class="note">記觸發、期限與目的地</text><text x="426" y="1050" class="tiny danger">待審不得先退款</text></g></g>
<g id="concept-decision" class="concept-card flow-node" data-title="人工決定" data-detail="有權者判定政策例外或身分驗證結果，明確記錄准駁和理由，回寫同一案件狀態。"><rect class="card-bg red" x="753" y="916" width="289" height="175" rx="16"/><g class="card-content"><text x="774" y="954" class="h danger">人工決定</text><text x="774" y="989" class="body">准駁與理由</text><text x="774" y="1018" class="note">例：競品比價不適用</text><text x="774" y="1050" class="tiny muted">回寫同一案件狀態</text></g></g>
<g id="concept-resume" class="concept-card flow-node" data-title="讀回並續作" data-detail="原代理讀回人工結果，才能正確向客戶說明並繼續其他獨立訴求；缺回注會重複升級或違反人工決定。"><rect class="card-bg green" x="1088" y="916" width="280" height="175" rx="16"/><g class="card-content"><text x="1109" y="954" class="h">代理讀回</text><text x="1109" y="989" class="body">從中斷點續作</text><text x="1109" y="1018" class="note">通知客戶，處理餘項</text><text x="1109" y="1050" class="tiny muted">避免同一問題反覆升級</text></g></g>
</g></g>
</svg>
