<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1290" role="img" aria-label="1.4 多訴求分流與退款工具前的身分、政策雙閘門">
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" style="fill:#23828b"/></marker><marker id="deny-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" style="fill:#bf6253"/></marker></defs>
<style>
text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#19374c}.title{font-size:33px;font-weight:700}.subtitle{font-size:18px;fill:#536d7d}.section-title{font-size:22px;font-weight:700}.card-title{font-size:21px;font-weight:700}.body{font-size:19px}.support{font-size:15px}.mono{font-family:Consolas,'Microsoft JhengHei',monospace;font-size:18px}.section-bg{fill:#f4f8fb;stroke:#d9e5ed;stroke-width:2}.card-bg{fill:#fff;stroke:#bed0dc;stroke-width:2}.mint{fill:#e5f5ef;stroke:#78bdab;stroke-width:2}.amber{fill:#fff1e1;stroke:#deb379;stroke-width:2}.danger{fill:#fff0eb;stroke:#da988b;stroke-width:2}.blue{fill:#eaf2f9;stroke:#a5c4d8;stroke-width:2}.flow-line{fill:none;stroke:#23828b;stroke-width:3;marker-end:url(#arrow)}.branch-line{fill:none;stroke:#23828b;stroke-width:3}.deny-line{fill:none;stroke:#bf6253;stroke-width:3;marker-end:url(#deny-arrow)}.teal-text{fill:#187b79}.red-text{fill:#ad5144}.orange-text{fill:#a76a39}.muted{fill:#5d7585}.divider{stroke:#dce7ed;stroke-width:2}
</style>
<rect width="1440" height="1290" style="fill:#fff"/>
<text x="48" y="58" class="title">1.4　多訴求可並行；退款必須過兩道程式閘門</text>
<text x="48" y="91" class="subtitle">代理可安排調查，退款是否真正執行由工具執行層核對前置條件</text>

<g id="section-split" class="section"><rect class="section-bg" x="40" y="117" width="1360" height="322" rx="22"/><g class="section-content">
<text x="66" y="154" class="section-title">一個客戶請求，拆成三條各自追蹤的支線</text>
<g id="concept-request" class="concept-card flow-node" data-title="客戶的多訴求請求" data-detail="客戶同時要求查包裹晚到原因、退運費、查本月帳單多收。系統分出三件事並保留共享客戶背景，獨立調查不用排成同一條長管線。"><rect class="card-bg" x="401" y="171" width="638" height="53" rx="13"/><g class="card-content"><text x="429" y="205" class="body">包裹晚到，請退運費，也查帳單多收</text></g></g>
<path class="branch-line" d="M720 224V242H257"/><path class="branch-line" d="M720 242H1183"/><path class="flow-line" d="M257 242V258"/><path class="flow-line" d="M720 242V258"/><path class="flow-line" d="M1183 242V258"/>
<g id="concept-refund-branch" class="concept-card flow-node" data-title="退款支線" data-detail="退款需先通過本次客戶身分與金額政策檢查，才能執行；初次取得客戶 ID 42 但驗證欄位為否，不可退款。"><rect class="card-bg danger" x="66" y="264" width="402" height="118" rx="15"/><g class="card-content"><text x="91" y="305" class="card-title red-text">運費退款</text><text x="91" y="342" class="body">進入下方的工具前雙閘門</text></g></g>
<g id="concept-delivery-branch" class="concept-card flow-node" data-title="物流調查支線" data-detail="物流代理可獨立查延誤，例中找到承運商轉運異常。此調查不依賴退款成功。"><rect class="card-bg" x="519" y="264" width="402" height="118" rx="15"/><g class="card-content"><text x="544" y="305" class="card-title">物流延誤</text><text x="544" y="342" class="body">承運商轉運異常</text></g></g>
<g id="concept-billing-branch" class="concept-card flow-node" data-title="帳單調查支線" data-detail="帳單代理查到疑似兩次扣款，第二筆尚未確認，需保留待辦並可能交人工核對。"><rect class="card-bg amber" x="972" y="264" width="402" height="118" rx="15"/><g class="card-content"><text x="997" y="305" class="card-title orange-text">帳單差額</text><text x="997" y="342" class="body">第二筆扣款尚待確認</text></g></g>
<g id="concept-prompt-guidance" class="concept-card" data-title="提示引導" data-detail="提示可以提醒代理先驗證身分、安排一般工作順序，但模型仍可能跳步；文字要求不能保證退款前置條件每次都被遵守。"><rect class="card-bg" x="66" y="394" width="630" height="36" rx="10"/><g class="card-content"><text x="83" y="419" class="body">提示引導：提醒先驗身分，無法保證阻擋</text></g></g>
<g id="concept-programmatic-enforcement" class="concept-card" data-title="程式化強制執行" data-detail="退款等硬性限制由應用程式工具執行層核對；身分或政策未通過時，process_refund 在執行前被拒絕，避免副作用。"><rect class="card-bg blue" x="720" y="394" width="654" height="36" rx="10"/><g class="card-content"><text x="737" y="419" class="body">程式閘門：執行前核對，未通過即拒絕工具</text></g></g>
</g></g>

<g id="section-gates" class="section"><rect class="section-bg" x="40" y="459" width="1360" height="542" rx="22"/><g class="section-content">
<text x="66" y="498" class="section-title">程式化強制執行｜模型提出退款請求，不等於退款工具獲准執行</text>
<path class="flow-line" d="M315 639H350"/><path class="flow-line" d="M675 639H710"/><path class="flow-line" d="M1035 639H1070"/>
<text x="687" y="622" class="support teal-text">是</text><text x="1046" y="622" class="support teal-text">是</text>
<g id="concept-proposed-refund" class="concept-card flow-node" data-title="模型提出 process_refund" data-detail="模型提出 process_refund，參數為 customer_id 42、order_id O-731、amount 120、currency TWD。這只是待執行的工具請求，尚無退款副作用。"><rect class="card-bg blue" x="66" y="545" width="249" height="175" rx="16"/><g class="card-content"><text x="90" y="586" class="card-title">模型提出呼叫</text><text x="90" y="623" class="mono">process_refund</text><text x="90" y="658" class="body">客戶 42・O-731</text><text x="90" y="688" class="support muted">TWD 120；尚未執行</text></g></g>
<g id="concept-identity-gate" class="concept-card flow-node" data-title="第一道：本次身分閘門" data-detail="程式在退款工具前檢查 get_customer 回傳的客戶 ID 是否已驗證且對應本次客戶與訂單。例中初次回傳 ID 42 但驗證為否，立即拒絕工具，沒有退款副作用。不能只檢查曾呼叫 get_customer。"><rect class="card-bg danger" x="350" y="545" width="325" height="175" rx="16"/><g class="card-content"><text x="374" y="586" class="card-title red-text">① 身分閘門</text><text x="374" y="624" class="body">已驗證 ID = 本次客戶？</text><text x="374" y="661" class="body">首次：ID 42，驗證＝否</text><text x="374" y="691" class="support muted">查到資料 ≠ 完成驗證</text></g></g>
<g id="concept-policy-gate" class="concept-card flow-node" data-title="第二道：金額與政策閘門" data-detail="完成本次客戶身分驗證後，程式仍需檢查 TWD 120 的金額、幣別與其他適用政策條件。通過身分檢查不能替代政策檢查；所有適用閘門都通過才執行。"><rect class="card-bg amber" x="710" y="545" width="325" height="175" rx="16"/><g class="card-content"><text x="734" y="586" class="card-title orange-text">② 政策閘門</text><text x="734" y="624" class="body">金額・幣別・政策合格？</text><text x="734" y="661" class="body">本例：TWD 120 再核對</text><text x="734" y="691" class="support muted">身分已過不代表政策已過</text></g></g>
<g id="concept-refund-executed" class="concept-card flow-node" data-title="兩道皆通過才執行退款" data-detail="完成身分驗證後，TWD 120 符合適用政策條件，工具才實際執行；回傳交易 ID R-204 與已完成狀態。系統保存結果供交接與避免重複操作。"><rect class="card-bg mint" x="1070" y="545" width="304" height="175" rx="16"/><g class="card-content"><text x="1094" y="586" class="card-title teal-text">允許 → 真正退款</text><text x="1094" y="624" class="mono">R-204</text><text x="1094" y="661" class="body">交易已完成</text><text x="1094" y="691" class="support muted">保存金額與交易狀態</text></g></g>
<path class="deny-line" d="M512 720V756"/><path class="deny-line" d="M872 720V756"/>
<text x="526" y="750" class="support red-text">否</text><text x="886" y="750" class="support red-text">否</text>
<g id="concept-identity-denied" class="concept-card flow-node" data-title="身分不足先拒絕工具" data-detail="若 ID 未驗證、不相符或驗證失敗，執行層在 process_refund 前拒絕，回報缺少前置條件；可補驗證，無法補驗證則交人工。此時沒有退款副作用。"><rect class="card-bg danger" x="350" y="763" width="325" height="93" rx="14"/><g class="card-content"><text x="374" y="801" class="card-title red-text">拒絕工具；沒有退款</text><text x="374" y="832" class="support muted">補驗證；必要時交人工</text></g></g>
<g id="concept-policy-denied" class="concept-card flow-node" data-title="政策不合格拒絕或轉人工" data-detail="即使已驗證身分，金額、幣別或其他適用政策條件不合格時也不能自動退款；在工具執行前阻擋或轉人工處理。"><rect class="card-bg danger" x="710" y="763" width="325" height="93" rx="14"/><g class="card-content"><text x="734" y="801" class="card-title red-text">拒絕自動退款</text><text x="734" y="832" class="support muted">按政策補正或交人工處理</text></g></g>
<g id="concept-case-path" class="concept-card" data-title="客戶 42 的兩次判定" data-detail="同一筆 O-731、TWD 120：首次 get_customer 回傳 ID 42 但未驗證，退款被擋且無副作用；身分驗證完成後，再核對金額、幣別與政策，全部通過才執行並保存 R-204。"><rect class="card-bg" x="66" y="883" width="1308" height="86" rx="14"/><g class="card-content"><text x="91" y="919" class="body">本例第一輪：ID 42 未驗證 → 先擋退款，沒有副作用</text><text x="91" y="951" class="body teal-text">補驗證後：身分與政策皆通過 → 執行 TWD 120 退款，保存 R-204</text></g></g>
</g></g>

<g id="section-merge" class="section"><rect class="section-bg" x="40" y="1021" width="1360" height="229" rx="22"/><g class="section-content">
<text x="66" y="1059" class="section-title">三支線合成答覆；帳單仍待查時，交接須可獨立接手</text>
<g id="concept-status-refund" class="concept-card" data-title="退款狀態" data-detail="運費 TWD 120 已退款，交易 R-204 已完成；明示已做過，避免重複操作。"><rect class="card-bg mint" x="66" y="1080" width="402" height="65" rx="13"/><g class="card-content"><text x="87" y="1121" class="body">退款：R-204 已完成</text></g></g>
<g id="concept-status-delivery" class="concept-card" data-title="物流狀態" data-detail="承運商轉運異常是已查出的延誤原因，可向客戶說明。"><rect class="card-bg" x="519" y="1080" width="402" height="65" rx="13"/><g class="card-content"><text x="540" y="1121" class="body">物流：承運商轉運異常</text></g></g>
<g id="concept-status-billing" class="concept-card" data-title="帳單仍待查" data-detail="疑似重複扣款，但第二筆尚未確認；保留開放狀態並交人工核對，不能說全部已解決。"><rect class="card-bg amber" x="972" y="1080" width="402" height="65" rx="13"/><g class="card-content"><text x="993" y="1121" class="body">帳單：第二筆尚待核對</text></g></g>
<text x="66" y="1184" class="section-title">人工交接四項：</text><text x="265" y="1184" class="body">① 對誰與驗證　② 發生什麼　③ 已做什麼／交易　④ 下一步與待辦</text>
<text x="66" y="1220" class="support muted">交接摘要須保留客戶 42、訂單 O-731、退款 R-204 與帳單未確認事項；部分成功不等於全案完成</text>
</g></g>
</svg>
