<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 845" role="img" aria-label="路徑條件規則的匹配與驗證">
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#17334b}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#526b7b}.h{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.section-bg{fill:#f3f8f6;stroke:#cfe2d9;stroke-width:2}.card-bg{fill:#fff;stroke:#b9d5c8;stroke-width:2}.flow-line{fill:none;stroke:#348263;stroke-width:3;marker-end:url(#arrow)}.branch-no{fill:none;stroke:#a6aeb3;stroke-width:2;stroke-dasharray:6 6}.match{fill:#0a7453;font-weight:700}.no{fill:#a14d35;font-weight:700}</style><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" style="fill:none;stroke:#348263;stroke-width:2;stroke-linejoin:round"/></marker></defs>
<rect width="1200" height="845" fill="white"/><text x="48" y="59" class="title">3.3　把規則綁到「接觸的檔案」</text><text x="48" y="91" class="sub">路徑模式是條件，不是提示中的關鍵字，也不是檔案系統權限。</text>
<g id="section-pattern" class="section"><rect class="section-bg" x="40" y="123" width="1120" height="138" rx="20"/><g class="section-content"><text x="64" y="159" class="h">規則檔：.claude/rules/component-tests.md</text><g id="concept-pattern" class="concept-card" data-title="paths 條件" data-detail="YAML frontmatter 中 paths: [&quot;**/*.test.tsx&quot;] 對跨目錄元件測試檔套用；沒有 paths 時主題規則會無條件載入。"><rect class="card-bg" x="64" y="181" width="1070" height="57" rx="13"/><g class="card-content"><text x="86" y="218" class="body">paths: ["**/*.test.tsx"]　→　Read/Write/Edit 接觸匹配 .test.tsx 時載入</text></g></g></g></g>
<g id="section-tree" class="section"><rect class="section-bg" x="40" y="281" width="1120" height="332" rx="20"/><g class="section-content"><text x="64" y="318" class="h">一條規則，跨樹匹配</text><text x="80" y="363" class="body">repo/</text><path class="flow-line" d="M153 358H284V401H328"/><path class="flow-line" d="M284 401V479H328"/><path class="branch-no" d="M284 479V557H328"/>
<g id="concept-web-test" class="concept-card flow-node" data-title="前端測試匹配" data-detail="apps/web/Button.test.tsx 匹配 **/*.test.tsx；以 Read、Write 或 Edit 接觸時觸發相應規則。"><rect class="card-bg" x="333" y="379" width="782" height="61" rx="13"/><g class="card-content"><text x="354" y="418" class="body">apps/web/Button.test.tsx　<tspan class="match">✓ 載入元件測試規則</tspan></text></g></g>
<g id="concept-ui-test" class="concept-card flow-node" data-title="套件測試匹配" data-detail="packages/ui/Dialog.test.tsx 同樣匹配，不必在兩個子目錄重複放 CLAUDE.md。"><rect class="card-bg" x="333" y="457" width="782" height="61" rx="13"/><g class="card-content"><text x="354" y="496" class="body">packages/ui/Dialog.test.tsx　<tspan class="match">✓ 同一規則</tspan></text></g></g>
<g id="concept-api-no" class="concept-card flow-node" data-title="非匹配檔案" data-detail="src/api/client.ts 不匹配測試路徑；僅在提示中提到測試檔名，也不能推定規則已載入。"><rect class="card-bg" x="333" y="535" width="782" height="61" rx="13"/><g class="card-content"><text x="354" y="574" class="body">src/api/client.ts　<tspan class="no">✕ 不因提到測試而載入</tspan></text></g></g></g></g>
<g id="section-check" class="section"><rect class="section-bg" x="40" y="633" width="1120" height="168" rx="20"/><g class="section-content"><text x="64" y="670" class="h">驗證要分開新會話，避免已載入規則污染比較</text>
<g id="concept-match-check" class="concept-card" data-title="匹配會話" data-detail="新會話 A 先讀匹配檔，再查 /context 是否載入規則。"><rect class="card-bg" x="64" y="691" width="500" height="84" rx="13"/><g class="card-content"><text x="85" y="725" class="body">A：讀匹配檔 → /context 應看到規則</text><text x="85" y="751" class="small">缺載時查 glob 與 YAML</text></g></g>
<g id="concept-nonmatch-check" class="concept-card" data-title="非匹配會話" data-detail="新會話 B 只讀不匹配檔，再查 /context。若規則仍載入，檢查是否漏寫 paths 或 frontmatter 有誤。"><rect class="card-bg" x="592" y="691" width="542" height="84" rx="13"/><g class="card-content"><text x="613" y="725" class="body">B：只讀不匹配檔 → 不應載入</text><text x="613" y="751" class="small">無 paths 或 YAML 錯誤可能變成常駐</text></g></g></g></g>
</svg>
