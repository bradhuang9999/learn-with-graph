<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 900" role="img" aria-labelledby="title desc"><title id="title">1.3 平行研究到可追溯綜整</title><desc id="desc">獨立子題可平行研究；比較代理必須等待兩份有來源的發現，再將主張與證據綁定。子代理不共享前文。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173149}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#567084}.section-bg{fill:#f2f7fb;stroke:#c3d5e1;stroke-width:2}.card-bg{fill:#fff;stroke:#acc5d5;stroke-width:2}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.flow-line{fill:none;stroke:#287ba4;stroke-width:4;marker-end:url(#arrow)}.blue{fill:#e5f1fa}.green{fill:#e1f2ea}.amber{fill:#fff2db}.red{fill:#fcece5}</style><defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 10 5 0 10Z" style="fill:#287ba4"/></marker></defs>
<text x="50" y="60" class="title">1.3 平行查證可以同輪；綜整必須等證據交接</text><text x="50" y="93" class="sub">每個子代理都是新上下文：讓「主張 ↔ 文件 ↔ 頁碼」一起走，不傳無出處摘要</text>
<g id="section-architecture" class="section"><rect class="section-bg" x="40" y="122" width="1300" height="530" rx="20"/><g class="section-content"><text x="68" y="164" class="head">委派依賴圖｜兩項獨立研究可並行，第三項須等待兩者完成</text>
<path class="flow-line" d="M293 332 H347 V263 H390"/><path class="flow-line" d="M293 332 H347 V450 H390"/><path class="flow-line" d="M730 263 H765 V355 H816"/><path class="flow-line" d="M730 450 H765 V355 H816"/><path class="flow-line" d="M1044 355 H1090"/>
<g id="concept-coordinator" class="concept-card flow-node" data-title="協調者" data-detail="考綱語境中 allowedTools 要含 Task 才能委派；實作名稱依所用版本核對。協調者說明範圍、完成條件與回傳格式。"><rect class="card-bg blue" x="68" y="259" width="225" height="146" rx="16"/><g class="card-content"><text x="90" y="303" class="head">協調者</text><text x="90" y="344" class="body">定義兩條研究線</text><text x="90" y="375" class="small">可委派 ≠ 子代理有工具</text></g></g>
<g id="concept-research-a" class="concept-card flow-node" data-title="研究代理 A" data-detail="報告甲第 12 頁的已核對主張：平均處理時間降低 18%。須保留網址、文件名與頁碼。"><rect class="card-bg" x="390" y="194" width="340" height="139" rx="16"/><g class="card-content"><text x="414" y="237" class="head">研究 A｜效率</text><text x="414" y="275" class="body">甲 p.12：處理時間 ↓18%</text><text x="414" y="305" class="small">主張與來源綁定</text></g></g>
<g id="concept-research-b" class="concept-card flow-node" data-title="研究代理 B" data-detail="報告乙第 4 頁的已核對主張：人工升級率增加。它是效率改善之外的代價證據，不能在綜整時丟掉。"><rect class="card-bg" x="390" y="381" width="340" height="139" rx="16"/><g class="card-content"><text x="414" y="424" class="head">研究 B｜代價</text><text x="414" y="462" class="body">乙 p.4：人工升級率 ↑</text><text x="414" y="492" class="small">反面證據一樣要傳</text></g></g>
<g id="concept-join" class="concept-card flow-node" data-title="協調者收齊並封裝交接" data-detail="兩個研究分支都先回報協調者。協調者等待必要結果、驗證來源與錯誤狀態，再把主張、來源、限制與待查問題交給綜整代理。"><rect class="card-bg amber" x="816" y="277" width="228" height="156" rx="16"/><g class="card-content"><text x="840" y="315" class="head">協調者扇入</text><text x="840" y="348" class="body">收齊 A ＋ B</text><text x="840" y="377" class="small">驗證並封裝交接</text><text x="840" y="404" class="small">缺口也要列出</text></g></g>
<g id="concept-synthesis" class="concept-card flow-node" data-title="綜整代理" data-detail="綜整代理只憑交接內容比較：有改善效率的證據，但人工升級率上升，不能直接宣稱整體品質提升。每項結論需可回指來源。"><rect class="card-bg green" x="1090" y="277" width="220" height="156" rx="16"/><g class="card-content"><text x="1112" y="323" class="head">綜整代理</text><text x="1112" y="361" class="body">逐項附來源</text><text x="1112" y="394" class="small">保留限制與缺口</text></g></g>
<text x="76" y="585" class="body">若 B 搜尋失敗：交接「B 覆蓋缺口＋失敗原因」，不能只憑 A 產生完整比較。</text></g></g>
<g id="section-packet" class="section"><rect class="section-bg" x="40" y="674" width="1300" height="188" rx="20"/><g class="section-content"><text x="68" y="715" class="head">可追溯交接封包｜三類欄位一起交付，不是先後步驟</text><g id="concept-claim" class="concept-card" data-title="已核對主張" data-detail="保留實際查到的主張內容，並與來源物件建立對應；主張不是放諸所有情境皆準的結論。"><rect class="card-bg blue" x="68" y="741" width="300" height="85" rx="13"/><g class="card-content"><text x="91" y="791" class="body">已核對主張</text></g></g><text x="393" y="792" class="head">＋</text><g id="concept-source" class="concept-card" data-title="來源位置" data-detail="來源需保留網址、文件名及頁碼；只有無出處摘要，下一個代理不能可靠補回引用。"><rect class="card-bg green" x="431" y="741" width="300" height="85" rx="13"/><g class="card-content"><text x="454" y="791" class="body">網址 · 文件 · 頁碼</text></g></g><text x="755" y="792" class="head">＋</text><g id="concept-boundaries" class="concept-card" data-title="限制與待查" data-detail="把待驗假設、期間或對象不一致、未解決問題及失敗支線分欄交接；避免把只在某來源成立的結果推廣成聯合結論。"><rect class="card-bg amber" x="794" y="741" width="516" height="85" rx="13"/><g class="card-content"><text x="817" y="791" class="body">待驗假設 · 限制 · 覆蓋缺口</text></g></g></g></g></svg>
