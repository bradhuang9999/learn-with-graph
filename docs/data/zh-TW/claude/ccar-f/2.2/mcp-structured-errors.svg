<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1300" role="img" aria-label="2.2 MCP 工具回應合約、批次部分成功與非冪等操作的重試閘門">
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" style="fill:none;stroke:#387a99;stroke-width:2;stroke-linejoin:round"/></marker></defs>
<style>
text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#1c3549}.title{font-size:33px;font-weight:700}.subtitle{font-size:18px;fill:#536d80}.section-title{font-size:22px;font-weight:700}.card-title{font-size:21px;font-weight:700}.body{font-size:19px}.support{font-size:15px}.mono{font-family:Consolas,'Microsoft JhengHei',monospace;font-size:19px}.section-bg{fill:#f4f8fb;stroke:#d7e4ec;stroke-width:2}.card-bg{fill:#fff;stroke:#bcd0df;stroke-width:2}.flow-line{fill:none;stroke:#387a99;stroke-width:3;marker-end:url(#arrow)}.branch-line{fill:none;stroke:#387a99;stroke-width:3}.divider{stroke:#dce7ed;stroke-width:2}.ok{fill:#e9f6ef;stroke:#78bea0;stroke-width:2}.err{fill:#fff0eb;stroke:#d99586;stroke-width:2}.amber{fill:#fff3e4;stroke:#e2b57b;stroke-width:2}.blue{fill:#eaf2f9;stroke:#a4c5db;stroke-width:2}.green-text{fill:#24765a}.red-text{fill:#aa5142}.orange-text{fill:#ad6933}.blue-text{fill:#326d94}.muted{fill:#5e7586}.chip{fill:#e9f1f7}
</style>
<rect width="1440" height="1300" style="fill:#fff"/>
<text x="50" y="58" class="title">2.2　工具回應要告訴代理：可信嗎？下一步是什麼？</text>
<text x="50" y="91" class="subtitle">成功空集合、暫時未知、業務拒絕是不同狀態；部分成功也要逐筆保存</text>

<g id="section-contract" class="section"><rect class="section-bg" x="40" y="116" width="1360" height="333" rx="22"/><g class="section-content">
<text x="66" y="154" class="section-title">MCP 工具回應合約｜先看結果旗標，再讀應用程式約定的欄位</text>
<g id="concept-empty-success" class="concept-card" data-title="成功但無匹配" data-detail="MCP 工具結果 isError: false，內容中的 items: [] 表示指定來源及查詢範圍內沒有匹配項。它不證明其他來源也沒有，也不能用來包裝 403 或逾時。"><rect class="card-bg ok" x="66" y="180" width="620" height="238" rx="17"/><g class="card-content"><text x="92" y="224" class="card-title green-text">成功查詢：可相信「本範圍沒有匹配」</text><text x="92" y="266" class="mono">isError: false</text><text x="92" y="303" class="mono">content → items: []</text><path class="divider" d="M92 326H660"/><text x="92" y="363" class="body">保留查詢範圍與完成狀態</text><text x="92" y="392" class="support muted">403 或逾時不能偽裝成成功空清單</text></g></g>
<g id="concept-structured-error" class="concept-card" data-title="可分流的錯誤結果" data-detail="isError: true 是 MCP 工具結果旗標。code、errorCategory、isRetryable、message、nextAction 是應用程式在 content 文字 JSON 中約定的欄位，可依用戶端能力另提供結構化內容；不能假設它們是 MCP 預設頂層欄位。範例：退款期限已過，code 為 REFUND_WINDOW_CLOSED，不可重試，下一步是人工申請。"><rect class="card-bg err" x="710" y="180" width="664" height="238" rx="17"/><g class="card-content"><text x="736" y="224" class="card-title red-text">執行失敗：不能當作成功結果</text><text x="736" y="266" class="mono">isError: true</text><text x="736" y="303" class="mono">content → code: REFUND_WINDOW_CLOSED</text><text x="736" y="340" class="mono">isRetryable: false → nextAction: 人工申請</text><path class="divider" d="M736 359H1348"/><text x="736" y="392" class="support muted">isError 為 MCP 旗標；errorCategory 等為應用程式自訂欄位</text></g></g>
</g></g>

<g id="section-batch" class="section"><rect class="section-bg" x="40" y="467" width="1360" height="374" rx="22"/><g class="section-content">
<text x="66" y="505" class="section-title">批次退款：A、B、C 各有自己的執行狀態</text>
<g id="concept-batch-request" class="concept-card flow-node" data-title="同批三筆退款" data-detail="子代理收到 A、B、C 三筆退款操作。即使同批執行，也須逐筆保存已完成、未知或拒絕狀態。"><rect class="card-bg blue" x="563" y="522" width="314" height="48" rx="13"/><g class="card-content"><text x="611" y="553" class="body">處理退款 A、B、C</text></g></g>
<path class="branch-line" d="M720 570V585H255"/><path class="branch-line" d="M720 585H1185"/><path class="flow-line" d="M255 585V601"/><path class="flow-line" d="M720 585V601"/><path class="flow-line" d="M1185 585V601"/>
<g id="concept-a-success" class="concept-card flow-node" data-title="A 已完成退款" data-detail="A 已確認退款成功；這只是 A 的局部結果，不表示整批都完成。需保留交易識別碼供核對。"><rect class="card-bg ok" x="66" y="607" width="402" height="143" rx="16"/><g class="card-content"><text x="90" y="649" class="card-title green-text">A｜已確認退款</text><text x="90" y="686" class="body">isError: false；已完成</text><text x="90" y="721" class="support muted">保留交易識別碼與結果</text></g></g>
<g id="concept-b-unknown" class="concept-card flow-node" data-title="B 逾時但執行狀態未知" data-detail="B 的退款呼叫逾時，工具結果標示暫時性錯誤；前次操作可能已在伺服器執行。即使 isRetryable 為 true，也不得直接重送，須先查交易狀態或使用同一冪等鍵。"><rect class="card-bg amber" x="519" y="607" width="402" height="143" rx="16"/><g class="card-content"><text x="543" y="649" class="card-title orange-text">B｜逾時，狀態未知</text><text x="543" y="686" class="body">transient；isRetryable: true</text><text x="543" y="721" class="support muted">不可直接重送：先確認交易</text></g></g>
<g id="concept-c-rejected" class="concept-card flow-node" data-title="C 業務規則拒絕" data-detail="C 超過自助退款期限，回傳 business 類別、穩定 code 與 isRetryable: false；解釋期限及人工申請途徑，同參數重試無效。"><rect class="card-bg err" x="972" y="607" width="402" height="143" rx="16"/><g class="card-content"><text x="996" y="649" class="card-title red-text">C｜業務規則拒絕</text><text x="996" y="686" class="body">期限已過；isRetryable: false</text><text x="996" y="721" class="support muted">說明原因與人工申請途徑</text></g></g>
<path class="flow-line" d="M720 750V768"/>
<g id="concept-b-needs-check" class="concept-card" data-title="B 進入下方查核" data-detail="只有 B 的退款執行狀態尚未確認；它先進入下方的交易查核與安全重試閘門，不立即交接或盲目重送。"><rect class="card-bg blue" x="519" y="775" width="402" height="45" rx="12"/><g class="card-content"><text x="542" y="804" class="body">B 未確認 → 下方先查核交易</text></g></g>
</g></g>

<g id="section-retry" class="section"><rect class="section-bg" x="40" y="859" width="1360" height="267" rx="22"/><g class="section-content">
<text x="66" y="897" class="section-title">B 的退款呼叫逾時：不代表退款未發生</text>
<path class="flow-line" d="M348 972H386"/><path class="flow-line" d="M777 972H815"/><path class="flow-line" d="M1124 972H1162"/>
<g id="concept-nonidempotent" class="concept-card flow-node" data-title="非冪等操作逾時" data-detail="退款等非冪等操作可能在伺服器完成後才發生回應逾時；直接重試可能造成重複退款。"><rect class="card-bg amber" x="66" y="919" width="282" height="110" rx="15"/><g class="card-content"><text x="88" y="959" class="card-title">退款呼叫逾時</text><text x="88" y="996" class="body orange-text">是否已執行？未知</text></g></g>
<g id="concept-side-effect-check" class="concept-card flow-node" data-title="重試前查副作用" data-detail="先查交易狀態或使用冪等鍵確認操作是否已產生副作用；若無法確認，保留未知狀態並交回協調者，不得盲目重試。"><rect class="card-bg blue" x="386" y="919" width="391" height="110" rx="15"/><g class="card-content"><text x="408" y="959" class="card-title blue-text">先查交易狀態／冪等鍵</text><text x="408" y="996" class="body">確認是否已有副作用</text></g></g>
<g id="concept-retry-condition" class="concept-card flow-node" data-title="按已執行狀態決定" data-detail="確認未執行且仍有重試預算，才有限次退避重試；已執行則保存交易結果，不再重試；無法確認則回報未知。"><rect class="card-bg" x="815" y="919" width="309" height="110" rx="15"/><g class="card-content"><text x="837" y="959" class="card-title">按結果分流</text><text x="837" y="995" class="support green-text">未執行且有預算 → 重試</text><text x="837" y="1017" class="support red-text">已執行／不明 → 不盲重試</text></g></g>
<g id="concept-safe-result" class="concept-card flow-node" data-title="保存狀態" data-detail="保留交易結果、重試次數及未知狀態，讓協調者能區分已完成、未確認與拒絕。"><rect class="card-bg ok" x="1162" y="919" width="212" height="110" rx="15"/><g class="card-content"><text x="1184" y="959" class="card-title green-text">保存狀態</text><text x="1184" y="996" class="body">不可猜成功</text></g></g>
<path class="flow-line" d="M969 1029V1044"/>
<g id="concept-batch-handoff" class="concept-card" data-title="無法本地復原才交協調者" data-detail="若 B 經交易核對仍無法確認，或安全重試後仍逾時，子代理停止重試，向協調者回報 A 已退款、B 未確認及已嘗試的方法、C 不能自助退款。不能把 B 當退款失敗，也不能把 A 的成功說成全批完成。"><rect class="card-bg" x="66" y="1052" width="1308" height="50" rx="12"/><g class="card-content"><text x="91" y="1084" class="body">僅 B 仍未確認／重試預算用盡 → 交協調者：A 已退款、B 未確認（含查核紀錄）、C 被拒絕</text></g></g>
</g></g>

<g id="section-categories" class="section"><rect class="section-bg" x="40" y="1144" width="1360" height="115" rx="22"/><g class="section-content"><text x="66" y="1181" class="section-title">四類錯誤的下一步</text>
<g id="concept-transient" class="concept-card" data-title="暫時性錯誤" data-detail="逾時或暫時不可用，有限次退避重試；非冪等操作先查副作用。"><rect class="card-bg" x="66" y="1196" width="300" height="44" rx="11"/><g class="card-content"><text x="84" y="1225" class="body">暫時性 → 有條件重試</text></g></g>
<g id="concept-validation" class="concept-card" data-title="驗證錯誤" data-detail="輸入格式或值無效；修正參數或詢問缺值，同參數重試無效。"><rect class="card-bg" x="391" y="1196" width="300" height="44" rx="11"/><g class="card-content"><text x="409" y="1225" class="body">驗證 → 修正輸入</text></g></g>
<g id="concept-business" class="concept-card" data-title="業務規則錯誤" data-detail="退款期限已過等規則限制不因重試改變；解釋並提供允許的途徑。"><rect class="card-bg" x="716" y="1196" width="300" height="44" rx="11"/><g class="card-content"><text x="734" y="1225" class="body">業務 → 解釋與替代途徑</text></g></g>
<g id="concept-permission" class="concept-card" data-title="權限錯誤" data-detail="缺權限或授權到期，應重新授權或交有權者；不可當作資料不存在。"><rect class="card-bg" x="1041" y="1196" width="333" height="44" rx="11"/><g class="card-content"><text x="1059" y="1225" class="body">權限 → 授權或交有權者</text></g></g>
</g></g>
</svg>
