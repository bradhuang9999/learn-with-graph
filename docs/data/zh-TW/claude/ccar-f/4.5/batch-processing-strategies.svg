<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1580" role="img" aria-labelledby="title desc">
<title id="title">4.5 批次處理：延遲決策、時間餘裕與逐筆補送</title><desc id="desc">阻斷式審查走同步，可等待工作走批次。30 小時 SLA 中最壞提交等待 4 小時加處理窗口 24 小時等於 28 小時，只餘 2 小時且非交付保證。1000 筆依 custom_id 對帳為 990 成功、8 服務錯誤、2 超長，僅分型補送失敗並檢查母文件完整性。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173247}.bg{fill:#f5f8fb}.title{font-size:36px;font-weight:700}.subtitle{font-size:19px;fill:#526b7e}.section-bg{fill:#fff;stroke:#d2e1e9;stroke-width:2}.section-label{font-size:18px;font-weight:700;fill:#55728b}.card-bg{fill:#fff;stroke:#a9c3d3;stroke-width:2.5}.sync-bg{fill:#fff2df;stroke:#d8ac65}.batch-bg{fill:#e6f5ee;stroke:#68ad88}.input-bg{fill:#e7f1fa;stroke:#6fa5c8}.success-bg{fill:#e6f5eb;stroke:#68ad82}.retry-bg{fill:#fff5e3;stroke:#d5ab63}.split-bg{fill:#fff0ed;stroke:#d38e81}.merge-bg{fill:#eef4fa;stroke:#8cb0ca}.head{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#536d80}.number{font-size:35px;font-weight:700;fill:#1d5678}.good{fill:#197552}.warn{fill:#a85c29}.danger{fill:#a6483c}.timeline-label{font-size:21px;font-weight:700}.timeline-note{font-size:18px}.tick{font-size:17px;font-weight:700;fill:#4f697d}.flow-line{fill:none;stroke:#6c889d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.merge-line{fill:none;stroke:#6c889d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.concept-card{cursor:pointer}.card-content{pointer-events:none}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" style="fill:#6c889d"/></marker></defs>
<rect class="bg" width="1600" height="1580"/>
<text class="title" x="65" y="70">4.5 先問等得起嗎，再算批次餘裕</text><text class="subtitle" x="65" y="108">批次約省 50%，但處理窗口與「多數很快完成」都不是延遲保證。</text>
<g id="section-choice" class="section"><rect class="section-bg" x="50" y="140" width="1500" height="295" rx="24"/><g class="section-content"><text class="section-label" x="80" y="180">處理方式取決於等待結果的後果</text></g></g>
<g id="section-timeline" class="section"><rect class="section-bg" x="50" y="465" width="1500" height="370" rx="24"/><g class="section-content"><text class="section-label" x="80" y="505">30 小時交付目標｜每 4 小時送一批的最壞排程容量</text></g></g>
<g id="section-results" class="section"><rect class="section-bg" x="50" y="865" width="1500" height="660" rx="24"/><g class="section-content"><text class="section-label" x="80" y="905">逐筆結果按 custom_id 對帳｜成功保留、失敗分型</text></g></g>
<!-- Edges are placed below nodes. -->
<path class="flow-line" d="M800 1055 V1095 H300 V1130"/><path class="flow-line" d="M800 1095 V1130"/><path class="flow-line" d="M800 1095 H1300 V1130"/>
<path class="merge-line" d="M300 1325 V1372 H800"/><path class="merge-line" d="M800 1325 V1372"/><path class="merge-line" d="M1300 1325 V1372 H800"/><path class="flow-line" d="M800 1372 V1400"/><text class="small" x="171" y="1357">品質核查</text><text class="small" x="600" y="1357">重送後的結果</text><text class="small" x="1115" y="1357">分段補送結果</text>
<text class="small" x="84" y="1554">單筆批次請求可用支援的伺服器端工具；需中途執行客戶端工具並回填時，改同步代理迴圈或拆成多個批次階段。</text>
<g id="concept-synchronous" class="concept-card" data-title="阻斷式工作用同步 Messages API" data-detail="合併前安全審查讓開發者與合併閘門等待，應用同步 Messages API，並設定逾時及失敗處置。不能拿批次多數一小時內完成當作每次的 SLA。"><rect class="card-bg sync-bg" x="80" y="218" width="690" height="170" rx="19"/><g class="card-content"><text class="head" x="111" y="264">等結果才能放行 → 同步</text><text class="body" x="111" y="309">合併前安全審查：人與流程正在等</text><text class="small" x="111" y="354">設定逾時與失敗處置</text></g></g>
<g id="concept-batch" class="concept-card" data-title="可等待的獨立工作用批次" data-detail="夜間摘要、隔日報表或每週稽核可用 Message Batches API；每筆請求獨立。考綱成本約低 50%，處理窗口可至 24 小時，卻沒有保證延遲的服務水準承諾。大量提交前先用小樣本同步驗證提示、Schema 與品質規則。"><rect class="card-bg batch-bg" x="830" y="218" width="690" height="170" rx="19"/><g class="card-content"><text class="head" x="861" y="264">結果稍後用 → 批次</text><text class="body" x="861" y="309">夜間摘要、隔日報表、每週稽核</text><text class="small" x="861" y="354">先用小樣本驗證，再送大量獨立請求</text></g></g>

<!-- The horizontal timeline is proportioned: 4 + 24 + 2 = 30. -->
<g id="concept-timeline" class="concept-card" data-title="30 小時目標只有 2 小時剩餘" data-detail="某文件剛錯過一輪提交，最多等 4 小時；再加考綱所述 24 小時處理窗口，共 28 小時。距 30 小時交付目標只剩 2 小時供下載、驗證、補送與人工檢查。這只是容量推算，批次沒有保證延遲或每筆成功；硬 SLA 應設預警、同步後備或更頻繁提交。">
<rect class="card-bg" x="80" y="530" width="1440" height="267" rx="19"/><g class="card-content">
<text class="tick" x="152" y="578">0h｜剛錯過提交</text><text class="tick" x="344" y="578">4h｜下次提交</text><text class="tick" x="1275" y="578">28h</text><text class="tick" x="1390" y="578">30h 目標</text>
<rect x="150" y="606" width="160" height="66" rx="8" style="fill:#dde7ee"/><rect x="310" y="606" width="960" height="66" style="fill:#b9dcef"/><rect x="1270" y="606" width="80" height="66" rx="8" style="fill:#f2bd8c"/>
<text class="timeline-label" x="183" y="646">等 4h</text><text class="timeline-label" x="674" y="646">處理窗口 24h</text><text class="timeline-label" x="1285" y="646">2h</text>
<text class="head" x="150" y="724">4h + 24h = 28h</text><text class="timeline-note" x="527" y="724">只餘 2h：下載、品質驗證、補送或覆核都要時間</text>
<text class="small" x="150" y="765">24h 窗口不等於每筆 24h 內成功；到期與重送可能超過 30h。硬承諾須預警或同步後備。</text>
</g></g>

<g id="concept-thousand" class="concept-card flow-node" data-title="1000 份合約按 custom_id 對帳" data-detail="提交 1000 份夜間合約，每筆帶唯一 custom_id，例如 contract-042-v1。結果可能亂序，須依 custom_id 對回母文件、版本與失敗原因，不能用結果行序。"><rect class="card-bg input-bg" x="535" y="937" width="530" height="118" rx="18"/><g class="card-content"><text class="number" x="565" y="988">1,000</text><text class="head" x="694" y="984">份合約</text><text class="body" x="565" y="1026">按 custom_id 配對亂序結果</text></g></g>
<g id="concept-success-990" class="concept-card flow-node" data-title="990 筆成功：保留結果" data-detail="990 筆成功結果保留，不重跑，避免重複成本和不同版本覆蓋；仍需通過摘要品質與來源驗證，API 層成功不等於業務可交付。"><rect class="card-bg success-bg" x="80" y="1130" width="440" height="195" rx="19"/><g class="card-content"><text class="number good" x="110" y="1185">990</text><text class="head" x="209" y="1181">成功｜保留</text><text class="body" x="110" y="1227">不重跑、不讓新版本覆蓋</text><text class="small" x="110" y="1285">仍要查摘要品質與來源</text></g></g>
<g id="concept-service-8" class="concept-card flow-node" data-title="8 筆服務錯誤：評估後重送" data-detail="8 筆因服務錯誤失敗，先按錯誤類型與重試政策判斷，再只重送這些文件。不能把每種失敗原樣重送。"><rect class="card-bg retry-bg" x="580" y="1130" width="440" height="195" rx="19"/><g class="card-content"><text class="number warn" x="610" y="1185">8</text><text class="head" x="678" y="1181">服務錯誤</text><text class="body" x="610" y="1227">按錯誤類型評估重試</text><text class="small" x="610" y="1285">只重送可恢復的失敗</text></g></g>
<g id="concept-too-long-2" class="concept-card flow-node" data-title="2 筆超長：先分段再以新版本提交" data-detail="2 筆超出上下文限制，不能原樣重送。先分段，保留母文件與段落映射，再以新 custom_id 如 contract-042-part-1-v2 提交。"><rect class="card-bg split-bg" x="1080" y="1130" width="440" height="195" rx="19"/><g class="card-content"><text class="number danger" x="1110" y="1185">2</text><text class="head" x="1178" y="1181">超長文件</text><text class="body" x="1110" y="1227">先分段，再送新版本 ID</text><text class="small" x="1110" y="1285">母文件 ↔ 段落對照不可丟</text></g></g>
<g id="concept-merge" class="concept-card flow-node" data-title="合併前檢查每份母文件完整" data-detail="依 custom_id 維護原結果、失敗原因及重送版本，合併時確認每份母文件的全部段落與品質驗證完成；若兩筆未完成，整批不能標為全部成功。custom_id 是關聯鍵，業務去重與冪等寫入仍由應用程式負責。"><rect class="card-bg merge-bg" x="310" y="1400" width="980" height="92" rx="17"/><g class="card-content"><text class="head" x="342" y="1439">合併檢查：母文件完整＋品質／來源驗證</text><text class="body" x="342" y="1470">版本與冪等寫入由應用程式管理；未完成不可標全批成功</text></g></g>
</svg>
