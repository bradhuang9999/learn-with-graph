<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1690" role="img" aria-labelledby="title desc">
<title id="title">3.6 Claude Code PR 審查 CI 管線</title><desc id="desc">PR diff 進入非互動審查，JSON 包裝內另有依 Schema 產生的 structured_output.findings。CI 檢查退出碼、解析及欄位，失敗則阻擋；成功時核對差異位置、跨次去重，再通過或發布發現。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#193247}.bg{fill:#f5f8fb}.title{font-size:36px;font-weight:700}.subtitle{font-size:19px;fill:#536b7d}.section-bg{fill:#fff;stroke:#d2e1e9;stroke-width:2}.section-label{font-size:18px;font-weight:700;fill:#55738b}.card-bg{fill:#fff;stroke:#abc5d4;stroke-width:2.5}.input-bg{fill:#e7f2f9;stroke:#68a5c8}.run-bg{fill:#e7f2f9;stroke:#68a5c8}.wrapper-bg{fill:#f0effb;stroke:#9b8bc9}.inner-bg{fill:#fff;stroke:#8fb79e;stroke-width:2}.check-bg{fill:#e9f5ef;stroke:#6fae88}.prior-bg{fill:#fff6e6;stroke:#d1ae67}.fail-bg{fill:#fff0ed;stroke:#d48679}.pass-bg{fill:#e7f5ea;stroke:#61aa7c}.report-bg{fill:#e7f1f9;stroke:#70a7c7}.head{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#536d80}.code{font-size:19px;font-weight:700;fill:#214f70}.key{font-size:21px;font-weight:700;fill:#16654d}.bad{font-size:19px;font-weight:700;fill:#a3453d}.flow-line{fill:none;stroke:#6c879b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.branch-line{fill:none;stroke:#6c879b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.fail-line{fill:none;stroke:#c26358;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#red-arrow)}.flow-label{font-size:17px;font-weight:700;fill:#536d80}.fail-label{font-size:17px;font-weight:700;fill:#a3453d}.concept-card{cursor:pointer}.card-content{pointer-events:none}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1 9 5.5 1 10Z" style="fill:#6c879b"/></marker><marker id="red-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1 9 5.5 1 10Z" style="fill:#c26358"/></marker></defs>
<rect class="bg" width="1600" height="1690"/>
<text class="title" x="65" y="69">3.6 PR 審查：從 diff 到可張貼的發現</text><text class="subtitle" x="65" y="106">非互動呼叫只啟動工作；外層 JSON、內層結果、程式驗證與去重各負責一段。</text>
<g id="section-run" class="section"><rect class="section-bg" x="50" y="140" width="1500" height="442" rx="24"/><g class="section-content"><text class="section-label" x="80" y="181">① 提供目前證據 → ② 無人值守執行 → ③ 讀取兩層輸出</text></g></g>
<g id="section-validate" class="section"><rect class="section-bg" x="50" y="615" width="1500" height="360" rx="24"/><g class="section-content"><text class="section-label" x="80" y="655">④ 程式先驗證，才能解讀 findings；失敗不可當成空陣列</text></g></g>
<g id="section-publish" class="section"><rect class="section-bg" x="50" y="1000" width="1500" height="365" rx="24"/><g class="section-content"><text class="section-label" x="80" y="1040">⑤ 對照前次審查與目前差異，再決定通過或發布</text></g></g>
<!-- Edges are under all nodes. -->
<path class="flow-line" d="M400 355 H465"/><path class="flow-line" d="M805 355 H875"/>
<path class="flow-line" d="M1190 536 V604 H380 V695"/>
<path class="flow-line" d="M650 775 H690"/>
<path class="fail-line" d="M650 725 V677 H1300 V695"/>
<path class="fail-line" d="M1070 775 H1110"/>
<path class="flow-line" d="M880 861 V1075"/>
<path class="flow-line" d="M480 1130 H690"/>
<path class="branch-line" d="M800 1210 V1235 H520"/><path class="branch-line" d="M960 1210 V1235 H1100"/>
<path class="flow-line" d="M520 1235 V1255"/><path class="flow-line" d="M1100 1235 V1255"/>
<text class="flow-label" x="70" y="606">取出 structured_output.findings</text>
<text class="fail-label" x="1110" y="725">退出／解析／欄位／定位失敗</text>
<text class="flow-label" x="612" y="1180">前次發現</text>

<g id="concept-ci-input" class="concept-card flow-node" data-title="本次差異與審查脈絡" data-detail="每次新審查會話提供基準提交、目前 PR diff、相依程式、既有測試、共享 CLAUDE.md 審查準則及前次發現。diff 可由 CI 預先產出，不必開放無範圍 Bash。"><rect class="card-bg input-bg" x="80" y="235" width="320" height="240" rx="19"/><g class="card-content"><text class="head" x="108" y="281">PR diff 與證據</text><text class="body" x="108" y="325">目前差異＋相依程式</text><text class="body" x="108" y="361">既有測試＋前次發現</text><text class="body" x="108" y="397">CLAUDE.md 共用準則</text><text class="small" x="108" y="442">新會話，只看提交後證據</text></g></g>
<g id="concept-cli-run" class="concept-card flow-node" data-title="非互動執行與工具邊界" data-detail="claude -p 或 --print 在 CI 中執行後結束，不等待人類回答；仍可使用獲准的讀取工具。--tools Read,Grep,Glob 限制內建工具；--allowedTools 是免詢問核准，不是可用性白名單；--disallowedTools mcp__* 另行移除 MCP 工具。另配置憑證、逾時與環境隔離。"><rect class="card-bg run-bg" x="465" y="235" width="340" height="240" rx="19"/><g class="card-content"><text class="head" x="493" y="281">claude -p 執行</text><text class="body" x="493" y="325">一次提示，結束即輸出</text><text class="code" x="493" y="363">--tools Read,Grep,Glob</text><text class="small" x="493" y="400">--allowedTools：免詢問核准</text><text class="small" x="493" y="433">--disallowedTools：MCP 另限</text></g></g>
<g id="concept-json-wrapper" class="concept-card flow-node" data-title="外層 JSON 包裝與內層結構化結果" data-detail="--output-format json 產生包含 result、session_id 等執行中繼資料的外層 JSON 包裝；--json-schema 約束業務結果形狀。真正要解析的問題陣列位於 structured_output.findings，不能把整個包裝當 findings，也不能因包裝存在就假定業務欄位存在。"><rect class="card-bg wrapper-bg" x="875" y="205" width="625" height="331" rx="20"/><g class="card-content"><text class="head" x="905" y="251">外層 JSON 包裝</text><text class="code" x="905" y="288">--output-format json</text><text class="body" x="905" y="325">result、session_id、執行中繼資料…</text><rect class="inner-bg" x="905" y="350" width="565" height="155" rx="16"/><text class="head" x="932" y="388">內層業務結果</text><text class="code" x="932" y="423">--json-schema → structured_output</text><text class="key" x="932" y="466">findings: [{path, line, reason}]</text><text class="small" x="932" y="491">無問題才是 findings: []；缺欄位不是 []</text></g></g>

<g id="concept-parse" class="concept-card flow-node" data-title="檢查退出碼並解析業務欄位" data-detail="先檢查程序退出碼、JSON 可解析性，並要求 structured_output 物件及 findings 陣列存在且符合 Schema。refusal、截斷、無效 JSON、缺 findings 或欄位不符均不是零發現。"><rect class="card-bg check-bg" x="110" y="695" width="540" height="166" rx="19"/><g class="card-content"><text class="head" x="139" y="738">檢查退出碼 → 解析 JSON</text><text class="body" x="139" y="777">讀 structured_output.findings</text><text class="key" x="139" y="816">findings=[] 才代表零項</text></g></g>
<g id="concept-validate-location" class="concept-card flow-node" data-title="驗證每項發現與目前差異" data-detail="逐項驗證 path、line、reason 的型別和值，確認檔案行號仍落在目前 PR 可評論差異上；提交後行號位移要重新定位或交人工，不能硬貼舊位置。Schema 不能驗證缺陷是否真實。"><rect class="card-bg check-bg" x="690" y="695" width="380" height="166" rx="19"/><g class="card-content"><text class="head" x="718" y="738">核對 path:line</text><text class="body" x="718" y="777">位置屬於目前 diff？</text><text class="small" x="718" y="817">位移就重新定位或人工處理</text></g></g>
<g id="concept-ci-fail" class="concept-card flow-node" data-title="驗證失敗：阻擋或人工檢查" data-detail="非零退出、無效 JSON、缺 structured_output.findings、欄位不符或無法定位時，CI 步驟失敗或標記待人工檢查。不得將失敗誤判為 findings=[]。"><rect class="card-bg fail-bg" x="1110" y="695" width="380" height="166" rx="19"/><g class="card-content"><text class="head" x="1138" y="738">CI 失敗／待人工</text><text class="bad" x="1138" y="777">缺 findings ≠ 無問題</text><text class="small" x="1138" y="817">不可把整份包裝直接張貼</text></g></g>

<g id="concept-prior" class="concept-card flow-node" data-title="前次審查發現" data-detail="第二次提交前，前次有 src/pay.ts:42 金額溢位與 src/pay.test.ts:18 缺失敗案例；新提交只修了測試。發布器保留溢位待辦，不重貼相同評論，已修測試不再報。"><rect class="card-bg prior-bg" x="110" y="1075" width="370" height="135" rx="18"/><g class="card-content"><text class="head" x="137" y="1118">前次發現</text><text class="body" x="137" y="1153">溢位未修；測試已補</text><text class="small" x="137" y="1185">用穩定識別鍵比對</text></g></g>
<g id="concept-dedup" class="concept-card flow-node" data-title="核對目前差異並跨次去重" data-detail="新會話只輸出新問題或仍未解的舊問題；發布器依路徑、問題型態與相關位置建立穩定鍵。已修問題消失，未修問題維持待辦且不新增相同評論。"><rect class="card-bg check-bg" x="690" y="1075" width="380" height="135" rx="18"/><g class="card-content"><text class="head" x="718" y="1118">定位後跨次去重</text><text class="body" x="718" y="1153">只留新問題／未解舊問題</text><text class="small" x="718" y="1185">Schema 不負責去重</text></g></g>
<g id="concept-zero-pass" class="concept-card flow-node" data-title="無發現：通過" data-detail="只有在退出與所有解析驗證成功、且 findings 為空陣列時，才可視為無發現；是否整體放行仍依 CI 政策與其他檢查。"><rect class="card-bg pass-bg" x="270" y="1255" width="500" height="84" rx="17"/><g class="card-content"><text class="head" x="300" y="1307">findings=[] → 審查步驟通過</text></g></g>
<g id="concept-report" class="concept-card flow-node" data-title="有效發現：發布或阻擋" data-detail="可定位且去重後的新發現交 PR 評論發布器；按專案政策可要求人工處理或阻擋合併。未修舊問題保留狀態，不重貼相同評論。"><rect class="card-bg report-bg" x="850" y="1255" width="500" height="84" rx="17"/><g class="card-content"><text class="head" x="880" y="1307">有效發現 → 報告／阻擋合併</text></g></g>
<g id="section-test-generation" class="section"><rect class="section-bg" x="50" y="1390" width="1500" height="240" rx="24"/><g class="section-content"><text class="section-label" x="80" y="1430">另一個 CI 工作：產生測試；先看既有覆蓋，寫入權與唯讀審查分開</text></g></g>
<path class="flow-line" d="M490 1540H555"/><path class="flow-line" d="M1010 1540H1075"/>
<g id="concept-test-input" class="concept-card flow-node" data-title="測試產生輸入" data-detail="提供目前變更、既有測試檔、fixture 與 CLAUDE.md 的測試判準；新會話不能假設自己見過先前測試。"><rect class="card-bg input-bg" x="80" y="1460" width="410" height="150" rx="18"/><g class="card-content"><text class="head" x="108" y="1502">既有測試與 fixture</text><text class="body" x="108" y="1543">連同目前變更、團隊準則</text><text class="small" x="108" y="1577">先盤點已覆蓋的輸入與斷言</text></g></g>
<g id="concept-test-gap" class="concept-card flow-node" data-title="只補真正缺口" data-detail="比較已有案例，找出未涵蓋的可觀察行為。若 499 和 501 已測但 500 未測，才考慮加入 500 邊界；未知產品規則須先釐清。"><rect class="card-bg check-bg" x="555" y="1460" width="455" height="150" rx="18"/><g class="card-content"><text class="head" x="583" y="1502">找未覆蓋的行為邊界</text><text class="body" x="583" y="1543">499／501 已測 → 檢查 500</text><text class="small" x="583" y="1577">已覆蓋就不要換名重做</text></g></g>
<g id="concept-test-verify" class="concept-card flow-node" data-title="產生後執行與驗證" data-detail="新測試需斷言對外可觀察行為，沿用 fixture；產生後執行新測試與相關回歸測試，檢查結果和重複性。"><rect class="card-bg report-bg" x="1075" y="1460" width="425" height="150" rx="18"/><g class="card-content"><text class="head" x="1103" y="1502">產生 → 執行 → 驗證</text><text class="body" x="1103" y="1543">斷言行為；跑相關回歸</text><text class="small" x="1103" y="1577">規則未定不可猜預期</text></g></g>
</svg>
