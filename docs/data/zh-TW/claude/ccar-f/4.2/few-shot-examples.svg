<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc"><title id="title">4.2 少樣本範例教判斷邊界</title><desc id="desc">真問題、可接受模式與模糊情況三種範例共同界定決策邊界。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173047}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#526a79}.section-bg{fill:#f2f7fb;stroke:#c5d8e4;stroke-width:2}.card-bg{fill:#fff;stroke:#b6cad9;stroke-width:2}.head{font-size:22px;font-weight:700;fill:#123b59}.body{font-size:18px}.small{font-size:16px}.flow-line{fill:none;stroke:#2c79a8;stroke-width:4;marker-end:url(#a)}.yes{fill:#e2f4ed}.no{fill:#fff0e7}.maybe{fill:#fff6dc}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2c79a8"/></marker></defs>
<text x="48" y="62" class="title">4.2 少樣本範例：教模型畫出判斷邊界</text><text x="48" y="94" class="sub">每例包含輸入、判法、可核查的理由與符合契約的輸出；少量異質範例優於大量同質範例</text>
<g id="section-examples" class="section"><rect class="section-bg" x="40" y="130" width="1120" height="338" rx="22"/><g class="section-content"><text x="65" y="168" class="head">三種必要的邊界樣本</text>
<g id="concept-positive" class="concept-card" data-title="可報的覆蓋缺口" data-detail="已搜尋全體相關測試，發現非管理員拒絕路徑沒有測試；只能報測試缺口，不能說已證實越權漏洞。"><rect class="card-bg yes" x="65" y="205" width="330" height="205" rx="18"/><g class="card-content"><text x="87" y="246" class="head">① 可報缺口 → 報告</text><text x="87" y="290" class="body">已確認相關測試皆未覆蓋</text><text x="87" y="329" class="body">例：非管理員拒絕路徑未測</text><text x="87" y="368" class="small">僅報測試缺口，不稱漏洞</text></g></g>
<g id="concept-negative" class="concept-card" data-title="可接受模式" data-detail="外觀可疑但符合既有測試、程式路徑或專案慣例，示範不報告。"><rect class="card-bg no" x="435" y="205" width="330" height="205" rx="18"/><g class="card-content"><text x="457" y="246" class="head">② 可接受 → 不報</text><text x="457" y="290" class="body">看似可疑但已有覆蓋</text><text x="457" y="329" class="body">例：空集合由別檔測試</text><text x="457" y="368" class="small">教「不要只比對表面」</text></g></g>
<g id="concept-unclear" class="concept-card" data-title="模糊情況" data-detail="來源或前提不足時，示範待查、補件、null，而非硬選一邊或臆造。"><rect class="card-bg maybe" x="805" y="205" width="330" height="205" rx="18"/><g class="card-content"><text x="827" y="246" class="head">③ 缺值 → 不臆填</text><text x="827" y="290" class="body">全文無出版年才填 null</text><text x="827" y="329" class="body">例：完成年≠出版年</text><text x="827" y="368" class="small">教「欄位語意不能混淆」</text></g></g>
</g></g>
<text x="235" y="511" class="sub">三種配對範例教決策邊界：報告缺口、不報已覆蓋、缺值不臆填</text>
<g id="section-transfer" class="section"><rect class="section-bg" x="40" y="550" width="1120" height="235" rx="22"/><g class="section-content"><text x="65" y="588" class="head">檢驗的是遷移能力，不是記住範例原句</text>
<g id="concept-newcase" class="concept-card flow-node" data-title="未見過的新案例" data-detail="例如 amount >= limit 的等於門檻未測；或付款日在附錄而不是標準表格。"><rect class="card-bg" x="67" y="622" width="320" height="117" rx="15"/><g class="card-content"><text x="87" y="662" class="head">未見過的新案例</text><text x="87" y="702" class="body">表面不同，判準相同</text></g></g><path class="flow-line" d="M387 679 H456"/>
<g id="concept-rule" class="concept-card flow-node" data-title="先找判準" data-detail="先盤點全部相關證據，辨別可證明的問題、可接受的反例與真正缺值。"><rect class="card-bg" x="460" y="622" width="320" height="117" rx="15"/><g class="card-content"><text x="480" y="662" class="head">先找證據與邊界</text><text x="480" y="702" class="body">不能只看單行或版面</text></g></g><path class="flow-line" d="M780 679 H849"/>
<g id="concept-output" class="concept-card flow-node" data-title="遵守輸出契約" data-detail="依案例輸出完整發現、無新發現或 null/待查，同時回到來源核驗事實。"><rect class="card-bg" x="853" y="622" width="280" height="117" rx="15"/><g class="card-content"><text x="873" y="662" class="head">一致的輸出</text><text x="873" y="702" class="body">報告／不報／待查</text></g></g></g></g>
<g id="section-extraction" class="section"><rect class="section-bg" x="40" y="807" width="1120" height="250" rx="22"/><g class="section-content"><text x="65" y="846" class="head">同一擷取欄位 publication_year：版面變化不是缺值</text>
<g id="concept-year-title" class="concept-card" data-title="標題頁找到 2024" data-detail="標題頁寫 2024 年出版，因此 publication_year=2024，來源位置為標題頁。"><rect class="card-bg yes" x="65" y="879" width="330" height="140" rx="18"/><g class="card-content"><text x="87" y="921" class="head">標題頁：2024 年出版</text><text x="87" y="965" class="body">→ 2024，標題頁</text></g></g>
<g id="concept-year-footnote" class="concept-card" data-title="腳註找到 2023" data-detail="正文沒有年份，但腳註寫本文於 2023 年出版；不能因正文缺值就輸出 null。"><rect class="card-bg yes" x="435" y="879" width="330" height="140" rx="18"/><g class="card-content"><text x="457" y="921" class="head">表格腳註：2023 出版</text><text x="457" y="965" class="body">→ 2023，腳註</text></g></g>
<g id="concept-year-missing" class="concept-card" data-title="研究完成年不等於出版年" data-detail="只有研究完成於 2022 年，全文沒有出版資訊；publication_year 必須為 null，不能把不同欄位冒充出版年。"><rect class="card-bg maybe" x="805" y="879" width="330" height="140" rx="18"/><g class="card-content"><text x="827" y="921" class="head">只寫研究完成於 2022</text><text x="827" y="965" class="body">→ null，無出版年</text></g></g>
</g></g><text x="48" y="1105" class="sub">範例須成對標示輸入與期望輸出；再用未見過的程式碼、版面測判準能否遷移。</text></svg>
