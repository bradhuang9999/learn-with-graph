<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
<title id="title">4.1 用明確標準提高精確度並減少誤報</title><desc id="desc">審查發現依證據與後果通過報告閘門，誤報資料再回饋標準。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173047}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#50677c}.section-bg{fill:#f2f7fb;stroke:#c7d7e3;stroke-width:2}.card-bg{fill:#fff;stroke:#b5c9d8;stroke-width:2}.card-content{font-size:18px}.head{font-size:22px;font-weight:700;fill:#123b59}.note{font-size:17px;fill:#36566d}.flow-line{fill:none;stroke:#2479a7;stroke-width:4;marker-end:url(#arrow)}.good{fill:#e3f5ed;stroke:#4caa80}.bad{fill:#fff0e9;stroke:#d68b68}.feedback{stroke:#b98534;stroke-dasharray:9 7}.branch-label{font-size:17px;font-weight:700;fill:#36566d}.muted-line{stroke:#7c8d9b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2479a7"/></marker></defs>
<text x="48" y="62" class="title">4.1 審查訊號：先定義「值得報告」</text><text x="48" y="94" class="sub">高信心不是正確準則；要有可觀察的觸發條件、程式路徑與後果</text>
<g id="section-gate" class="section"><rect class="section-bg" x="40" y="128" width="1120" height="385" rx="22"/><g class="section-content"><text x="66" y="165" class="head">報告閘門｜同一可疑處先依規則分流</text>
<g id="concept-input" class="concept-card flow-node" data-title="可疑程式碼" data-detail="審查的起點可能是功能錯誤、安全缺陷、註解差異或只是風格偏好。"><rect class="card-bg" x="70" y="226" width="205" height="154" rx="17"/><g class="card-content"><text x="91" y="267" class="head">可疑處</text><text x="91" y="304">先檢查實際行為</text><text x="91" y="337">而非語氣或直覺</text></g></g>
<path class="flow-line" d="M275 302 H341"/><g id="concept-evidence" class="concept-card flow-node" data-title="證據門檻" data-detail="能指出檔案位置、觸發輸入、程式路徑與可觀察後果；未知前提應標待查。"><rect class="card-bg" x="345" y="226" width="263" height="154" rx="17"/><g class="card-content"><text x="367" y="267" class="head">證據門檻</text><text x="367" y="304">位置＋觸發條件</text><text x="367" y="337">實際行為＋後果</text></g></g>
<path class="flow-line" d="M608 302 H677 V242 H724"/><path class="flow-line muted-line" d="M677 302 V417 H724"/><text x="642" y="215" class="branch-label">符合準則</text><text x="615" y="394" class="branch-label">不符／待查</text>
<g id="concept-report" class="concept-card flow-node" data-title="報告有證據的缺陷" data-detail="現有程式路徑可證明的功能錯誤或安全缺陷，附上風險相稱的嚴重度與修法。"><rect class="card-bg good" x="728" y="185" width="365" height="119" rx="17"/><g class="card-content"><text x="750" y="226" class="head">報告：有證據的缺陷</text><text x="750" y="265">依後果定嚴重度與修法</text></g></g>
<g id="concept-skip" class="concept-card flow-node" data-title="略過或標待查" data-detail="純排版、命名偏好與沒有可證明後果的慣例寫法略過；缺少外部前提則標待查。"><rect class="card-bg bad" x="728" y="360" width="365" height="119" rx="17"/><g class="card-content"><text x="750" y="401" class="head">略過／待查</text><text x="750" y="440">偏好不報；前提不足不硬判</text></g></g>
</g></g>
<g id="section-calibrate" class="section"><rect class="section-bg" x="40" y="535" width="1120" height="295" rx="22"/><g class="section-content"><text x="66" y="574" class="head">誤報回饋｜按類別修標準，而不是只改信心門檻</text>
<g id="concept-measure" class="concept-card" data-title="分型計數" data-detail="逐類記錄報告數、接受數與駁回原因；整體平均會掩蓋特定類別的干擾。"><rect class="card-bg" x="70" y="610" width="286" height="128" rx="16"/><g class="card-content"><text x="90" y="649" class="head">① 分型計數</text><text x="90" y="687">報告／接受／駁回原因</text></g></g>
<path class="flow-line" d="M356 674 H421"/><g id="concept-suspend" class="concept-card" data-title="局部暫停或轉人工" data-detail="僅對高誤報類別暫停自動報告或轉人工，保留已有效且高風險的檢查。"><rect class="card-bg" x="425" y="610" width="286" height="128" rx="16"/><g class="card-content"><text x="445" y="649" class="head">② 局部暫停</text><text x="445" y="687">高風險轉人工；保留有效項</text></g></g>
<path class="flow-line" d="M711 674 H776"/><g id="concept-retest" class="concept-card" data-title="修訂並驗證" data-detail="以駁回樣本重寫類別準則，在代表性樣本中確認誤報下降且真缺陷仍可找出。"><rect class="card-bg" x="780" y="610" width="313" height="128" rx="16"/><g class="card-content"><text x="800" y="649" class="head">③ 修準則並驗證</text><text x="800" y="687">同樣本驗證後恢復</text></g></g>
<path class="flow-line feedback" d="M936 738 V769 H213 V740"/><text x="447" y="795" class="note">恢復條件：誤報下降，真正缺陷仍找得到</text></g></g>
<g id="section-severity" class="section"><rect class="section-bg" x="40" y="854" width="1120" height="224" rx="22"/><g class="section-content"><text x="66" y="891" class="head">嚴重度｜按可觀察後果分級，不按程式外觀或信心分級</text>
<g id="concept-severe-high" class="concept-card" data-title="高：資料或核心交易風險" data-detail="例如未檢查身分就回傳他人發票，造成未授權資料讀取。"><rect class="card-bg bad" x="70" y="921" width="330" height="125" rx="16"/><g class="card-content"><text x="90" y="959" class="head">高｜權限／核心交易</text><text x="90" y="999">例：未驗身分讀他人發票</text></g></g>
<g id="concept-severe-medium" class="concept-card" data-title="中：特定有效輸入錯誤" data-detail="例如跨月日期被當成同月，報表少算一天，但有可用迴避方式。"><rect class="card-bg" x="435" y="921" width="330" height="125" rx="16"/><g class="card-content"><text x="455" y="959" class="head">中｜特定輸入錯誤</text><text x="455" y="999">例：跨月報表少算一天</text></g></g>
<g id="concept-severe-low" class="concept-card" data-title="低：局部可觀察偏差" data-detail="例如錯誤訊息顯示錯誤欄位名稱，但使用者仍可完成操作。"><rect class="card-bg good" x="800" y="921" width="293" height="125" rx="16"/><g class="card-content"><text x="820" y="959" class="head">低｜局部偏差</text><text x="820" y="999">例：訊息標錯欄位</text></g></g>
</g></g>
<text x="48" y="1123" class="sub">邊界例：註解說「≤ 500 免審」，實作卻用 &lt; 500；只有 500 的實測差異才支持報告。</text>
</svg>
