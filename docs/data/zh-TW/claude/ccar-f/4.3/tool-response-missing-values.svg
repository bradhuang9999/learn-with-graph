<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">4.3 工具回應與缺值契約</title><desc id="desc">結構化擷取先確認工具回應狀態，再按 Schema、來源與業務語意驗證；required 不表示來源一定有值。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173047}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#50677c}.section-bg{fill:#f2f7fb;stroke:#c7d7e3;stroke-width:2}.card-bg{fill:#fff;stroke:#acc7d6;stroke-width:2}.head{font-size:22px;font-weight:700;fill:#123b59}.body{font-size:18px}.small{font-size:16px}.flow-line{fill:none;stroke:#267aa7;stroke-width:4;marker-end:url(#a)}.blue{fill:#e7f2fa}.green{fill:#e3f4ec}.amber{fill:#fff3d9}.red{fill:#fff0e9}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#267aa7"/></marker></defs>
<text x="50" y="61" class="title">4.3 工具參數有形狀，不代表整次回應有真相</text><text x="50" y="93" class="sub">看停止原因、讀對區塊，再區分「缺值」「其他類別」和「來源衝突」</text>
<g id="section-contract" class="section"><rect class="section-bg" x="40" y="125" width="1320" height="285" rx="21"/><g class="section-content"><text x="68" y="164" class="head">擷取契約：三種容易混淆的保證</text>
<g id="concept-required" class="concept-card" data-title="required 與 null" data-detail="required 只保證回應物件有鍵；若來源沒有統編，欄位型別須允許 null，不能臆造一個值。"><rect class="card-bg blue" x="68" y="199" width="393" height="170" rx="16"/><g class="card-content"><text x="90" y="241" class="head">① required ≠ 一定有值</text><text x="90" y="284" class="body">鍵要存在；來源缺值用 null</text><text x="90" y="322" class="small">收據無統編 → merchant_tax_id=null</text></g></g>
<g id="concept-category" class="concept-card" data-title="other 與 unclear" data-detail="other 是來源明確屬於列舉之外的類別，需填具體名稱；unclear 是來源不足或歧義，不能硬選。"><rect class="card-bg amber" x="502" y="199" width="393" height="170" rx="16"/><g class="card-content"><text x="524" y="241" class="head">② other ≠ unclear</text><text x="524" y="284" class="body">明確新類別 → other＋細目</text><text x="524" y="322" class="small">資料不足 → unclear，保留歧義</text></g></g>
<g id="concept-strict" class="concept-card" data-title="strict 約束範圍" data-detail="在支援的工具上 strict:true 約束實際 tool_use 參數符合支援的 Schema 子集；不保證選對文件工具，也不保證來源事實正確。"><rect class="card-bg green" x="936" y="199" width="396" height="170" rx="16"/><g class="card-content"><text x="958" y="241" class="head">③ strict ≠ 事實正確</text><text x="958" y="284" class="body">工具參數合形狀，仍須核對</text><text x="958" y="322" class="small">工具名稱、來源位置、金額關係</text></g></g>
</g></g>
<g id="section-response" class="section"><rect class="section-bg" x="40" y="432" width="1320" height="365" rx="21"/><g class="section-content"><text x="68" y="471" class="head">API 回應接線：先看 stop_reason，不能跳到 JSON 解析</text>
<g id="concept-response" class="concept-card flow-node" data-title="模型回應" data-detail="應用程式收到模型回應後，先檢查 stop_reason；不能假設任何回應都含有效擷取物件。"><rect class="card-bg" x="68" y="526" width="230" height="148" rx="16"/><g class="card-content"><text x="90" y="570" class="head">模型回應</text><text x="90" y="612" class="body">先讀 stop_reason</text></g></g>
<path class="flow-line" d="M298 600 H380"/>
<g id="concept-tooluse" class="concept-card flow-node" data-title="tool_use 分支" data-detail="只有 tool_use 分支才讀工具名稱及 input，先確認選對工具、Schema 與欄位型別，再進來源和語意驗證。"><rect class="card-bg green" x="385" y="503" width="435" height="148" rx="16"/><g class="card-content"><text x="408" y="547" class="head">tool_use → 讀 name＋input</text><text x="408" y="590" class="body">核對工具類型、欄位與 Schema</text><text x="408" y="625" class="small">再交來源與業務語意驗證</text></g></g>
<path class="flow-line" d="M820 577 H890"/>
<g id="concept-semantic" class="concept-card flow-node" data-title="來源與語意門" data-detail="對照原文位置、金額加總、日期、幣別及欄位意義；Schema 合法的數字仍可能錯。"><rect class="card-bg blue" x="895" y="503" width="437" height="148" rx="16"/><g class="card-content"><text x="918" y="547" class="head">來源＋語意再驗證</text><text x="918" y="590" class="body">可解析 ≠ 可入帳</text><text x="918" y="625" class="small">原文位置／加總／單位／歧義</text></g></g>
<path class="flow-line" d="M190 674 V727 H384"/>
<g id="concept-refusal" class="concept-card flow-node" data-title="refusal 分支" data-detail="refusal 表示拒絕，不可把它當空值或有效擷取資料入庫。"><rect class="card-bg red" x="385" y="689" width="435" height="81" rx="15"/><g class="card-content"><text x="408" y="722" class="head">refusal → 沒有擷取物件</text><text x="408" y="751" class="small">依拒絕策略處理，不寫入資料</text></g></g>
<g id="concept-truncated" class="concept-card flow-node" data-title="max_tokens 分支" data-detail="max_tokens 可能截斷結構化回應；依產品策略提高上限或重試，不能把不完整資料當有效物件。"><rect class="card-bg amber" x="895" y="689" width="437" height="81" rx="15"/><g class="card-content"><text x="918" y="722" class="head">max_tokens → 可能截斷</text><text x="918" y="751" class="small">調整上限或重試，勿當完整結果</text></g></g>
<path class="flow-line" d="M190 674 V783 H1110 V770"/><text x="218" y="701" class="small">依停止原因分流</text>
</g></g>
<g id="section-case" class="section"><rect class="section-bg" x="40" y="819" width="1320" height="217" rx="21"/><g class="section-content"><text x="68" y="858" class="head">同樣符合 Schema，資料處置卻不同</text>
<g id="concept-receipt" class="concept-card" data-title="誠實缺值" data-detail="收據明寫 NT$840 但未提供統編，merchant_tax_id=null 是正確擷取；不得為滿足 required 而臆造。"><rect class="card-bg green" x="68" y="887" width="601" height="118" rx="15"/><g class="card-content"><text x="90" y="929" class="head">收據：NT$840、無統編</text><text x="90" y="969" class="body">總額 840＋統編 null → 可帶來源存檔</text></g></g>
<g id="concept-conflict" class="concept-card" data-title="結構合法但來源衝突" data-detail="品項 300+200、稅 0，原文印 800；即使 tool_use 完全符合 Schema，也須保存印刷總額與計算值並標衝突，不能自行改寫。"><rect class="card-bg red" x="701" y="887" width="631" height="118" rx="15"/><g class="card-content"><text x="723" y="929" class="head">發票：300＋200＋稅 0，印刷 800</text><text x="723" y="969" class="body">形狀合法，數值不一致 → 保留雙值並標衝突</text></g></g>
</g></g>
</svg>
