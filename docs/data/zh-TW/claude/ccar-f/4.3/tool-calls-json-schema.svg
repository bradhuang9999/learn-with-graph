<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 985" role="img" aria-labelledby="title desc"><title id="title">4.3 結構化輸出雙層契約</title><desc id="desc">工具選擇、Schema 結構檢查及來源語意驗證依序處理，結構正確不等於事實正確。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173047}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#546b7b}.section-bg{fill:#f2f7fb;stroke:#c7d7e3;stroke-width:2}.card-bg{fill:#fff;stroke:#abc5d4;stroke-width:2}.head{font-size:22px;font-weight:700;fill:#123b59}.body{font-size:18px}.small{font-size:16px}.flow-line{fill:none;stroke:#2a79a4;stroke-width:4;marker-end:url(#a)}.blue{fill:#e5f1fa}.green{fill:#e6f5ed}.amber{fill:#fff4da}.red{fill:#fff0e9}.branch{font-size:16px;font-weight:700;fill:#7b4f2e}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2a79a4"/></marker></defs>
<text x="48" y="62" class="title">4.3 結構化輸出：接線契約 ≠ 資料真實</text><text x="48" y="94" class="sub">工具呼叫與嚴格 Schema 限制形狀；來源對照與業務規則另做驗證</text>
<g id="section-pipeline" class="section"><rect class="section-bg" x="40" y="128" width="1120" height="405" rx="22"/><g class="section-content"><text x="65" y="166" class="head">一筆文件擷取的兩道門</text>
<g id="concept-source" class="concept-card flow-node" data-title="來源文件" data-detail="可能是發票、收據等不同文件；先保留原文與可定位的欄位證據。"><rect class="card-bg" x="66" y="216" width="205" height="142" rx="16"/><g class="card-content"><text x="88" y="258" class="head">來源文件</text><text x="88" y="304" class="body">保留原文位置</text></g></g><path class="flow-line" d="M271 287 H325"/>
<g id="concept-tooluse" class="concept-card flow-node" data-title="工具呼叫與 Schema" data-detail="用 tool_use 的 input 收集結構化欄位；strict:true 在支援情況下約束實際工具參數符合支援的 Schema 子集。"><rect class="card-bg blue" x="329" y="216" width="261" height="142" rx="16"/><g class="card-content"><text x="351" y="258" class="head">① 形狀門</text><text x="351" y="304" class="body">tool_use ＋ Schema</text></g></g><path class="flow-line" d="M590 287 H644"/>
<g id="concept-semantic" class="concept-card flow-node" data-title="來源與語意驗證" data-detail="核對原文字段位置、品項加稅與總額、日期/幣別及缺值語意；合法 JSON 仍可能填錯。"><rect class="card-bg green" x="648" y="216" width="262" height="142" rx="16"/><g class="card-content"><text x="670" y="258" class="head">② 真實門</text><text x="670" y="304" class="body">來源＋業務規則</text></g></g><path class="flow-line" d="M910 287 H964"/><path class="flow-line" d="M780 358 V382"/><text x="793" y="380" class="branch">衝突</text>
<g id="concept-downstream" class="concept-card flow-node" data-title="下游使用" data-detail="只有完成結構與語意驗證後才交下游；衝突需保留兩個值並標示。"><rect class="card-bg" x="968" y="216" width="164" height="142" rx="16"/><g class="card-content"><text x="989" y="258" class="head">下游</text><text x="989" y="304" class="body">可追溯使用</text></g></g><g id="concept-quarantine" class="concept-card flow-node" data-title="語意衝突須隔離待查" data-detail="品項 300+200、稅 0、印刷 800 時保留印刷值與計算值並標記衝突，不可自行修成 500，也不能直接入帳。"><rect class="card-bg red" x="648" y="386" width="484" height="92" rx="16"/><g class="card-content"><text x="670" y="424" class="head">驗證失敗 → 隔離待查</text><text x="670" y="459" class="body">保留印刷 800 與計算 500</text></g></g><text x="67" y="505" class="small">例：items 300＋200、稅 0、印刷 800 → Schema 合法，但總額不符。</text></g></g>
<g id="section-choice" class="section"><rect class="section-bg" x="40" y="555" width="1120" height="342" rx="22"/><g class="section-content"><text x="65" y="594" class="head">tool_choice：控制「是否、選哪個工具」</text>
<g id="concept-auto" class="concept-card" data-title="auto" data-detail="工具可選；模型也可能只回自由文字，因此下游必須要結構時不能單靠 auto。"><rect class="card-bg" x="65" y="631" width="330" height="126" rx="16"/><g class="card-content"><text x="86" y="669" class="head">auto｜可不用工具</text><text x="86" y="714" class="body">適合選擇性工具步驟</text></g></g>
<g id="concept-any" class="concept-card" data-title="any" data-detail="在支援強制工具選擇的模型與設定上，要求從多個工具中選一個；不保證類型選對。"><rect class="card-bg blue" x="435" y="631" width="330" height="126" rx="16"/><g class="card-content"><text x="456" y="669" class="head">any｜必選一個</text><text x="456" y="714" class="body">文件型別未知時可用</text></g></g>
<g id="concept-forced" class="concept-card" data-title="指定工具" data-detail="在支援的設定上強制呼叫特定工具，例如先擷取中繼資料；仍須處理拒絕或截斷。"><rect class="card-bg" x="805" y="631" width="330" height="126" rx="16"/><g class="card-content"><text x="826" y="669" class="head">指定工具｜必選它</text><text x="826" y="714" class="body">固定的前置擷取步驟</text></g></g>
<g id="concept-stop" class="concept-card" data-title="停止原因與缺值" data-detail="先看 stop_reason：tool_use 才讀工具區塊；refusal 或 max_tokens 需分別處置。required 表示鍵存在，不代表來源有值；null 與 unclear 有不同意義。"><rect class="card-bg amber" x="65" y="783" width="1070" height="88" rx="15"/><g class="card-content"><text x="86" y="819" class="head">例外出口：先看 stop_reason；缺值用 null、歧義用 unclear</text><text x="86" y="848" class="small">required 是鍵存在，不是來源必有值；refusal 與 max_tokens 不能當有效擷取。</text></g></g>
</g></g><text x="48" y="943" class="sub">格式正規化（日期、幣別、單位）仍要明寫；strict 不替你核對事實。</text></svg>
