<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
<title id="title">4.4 驗證、重試與回饋迴圈</title><desc id="desc">來源證據進入擷取和三層檢查，再分為可修正錯誤、來源缺失、來源衝突；只有可修正錯誤形成有限重試回路。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173247}.bg{fill:#f5f8fb}.title{font-size:36px;font-weight:700}.subtitle{font-size:19px;fill:#526a7d}.section-bg{fill:#fff;stroke:#d7e2eb;stroke-width:2}.section-label{font-size:17px;font-weight:700;fill:#58748c}.card-bg{fill:#fff;stroke:#aac4d4;stroke-width:2.5}.source-bg{fill:#e6f5f1;stroke:#58aa98}.extract-bg{fill:#e8f1fa;stroke:#69a2cc}.check-bg{fill:#f1effb;stroke:#9e90d0}.repair-bg{fill:#e9f6ed;stroke:#6ead83}.missing-bg{fill:#fff5df;stroke:#d9ae54}.conflict-bg{fill:#fff0ed;stroke:#d8887b}.pass-bg{fill:#e5f5e9;stroke:#5eaa77}.note-bg{fill:#f5f8fb;stroke:#b9cbd8}.head{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#536d80}.number{font-size:17px;font-weight:700;fill:#6b59a5}.key{font-size:21px;font-weight:700;fill:#155a55}.warn{font-size:19px;font-weight:700;fill:#9a483d}.flow-line{fill:none;stroke:#71899b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.branch-line{fill:none;stroke:#71899b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.retry-line{fill:none;stroke:#318362;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 9;marker-end:url(#arrow-green)}.pass-line{fill:none;stroke:#318362;stroke-width:4;marker-end:url(#arrow-green)}.flow-label{font-size:17px;font-weight:700;fill:#4b6579}.repair-label{font-size:17px;font-weight:700;fill:#277653}.concept-card{cursor:pointer}.card-content{pointer-events:none}@keyframes dash{to{stroke-dashoffset:-42}}.retry-line{animation:dash 2.5s linear infinite}@media (prefers-reduced-motion:reduce){.retry-line{animation:none}}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" style="fill:#71899b"/></marker><marker id="arrow-green" viewBox="0 0 12 12" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" style="fill:#318362"/></marker></defs>
<rect class="bg" width="1600" height="1500"/>
<text class="title" x="70" y="73">4.4 驗證後先判斷錯因，再決定是否重試</text><text class="subtitle" x="70" y="111">合法 JSON 也可能填錯值；重試只有在來源有答案、錯誤可指出時才有用。</text>
<g id="section-main" class="section"><rect class="section-bg" x="55" y="145" width="1490" height="595" rx="24"/><g class="section-content"><text class="section-label" x="85" y="185">主流程｜來源證據 → 擷取 → 三層驗證 → 分流</text></g></g>
<g id="section-outcomes" class="section"><rect class="section-bg" x="55" y="770" width="1490" height="430" rx="24"/><g class="section-content"><text class="section-label" x="85" y="808">驗證失敗的三種出口｜只有左路形成回圈</text></g></g>
<g id="section-review" class="section"><rect class="section-bg" x="55" y="1260" width="1490" height="185" rx="24"/><g class="section-content"><text class="section-label" x="85" y="1298">回饋也可改善審查代理</text></g></g>
<!-- Edges below nodes; the green return path is the retry loop. -->
<path class="flow-line" d="M400 351 H475"/><path class="flow-line" d="M805 351 H850 V240 H900"/><path class="flow-line" d="M1195 280 V300"/><path class="flow-line" d="M1195 381 V401"/><path class="flow-line" d="M1195 482 V572"/>
<path class="pass-line" d="M1290 634 H1330"/><path class="branch-line" d="M1145 696 V827 H290"/><path class="branch-line" d="M1145 827 H1320"/><path class="flow-line" d="M290 827 V848"/><path class="flow-line" d="M800 827 V848"/><path class="flow-line" d="M1320 827 V848"/>
<path class="retry-line" d="M290 1128 V1228 H25 V215 H550 V266"/>
<text class="flow-label" x="944" y="514">逐層通過</text><text class="flow-label" x="1175" y="754">未通過：先辨認錯因</text><text class="flow-label" x="1300" y="615">通過</text><text class="repair-label" x="75" y="1221">帶回原文件、失敗輸出、具體錯誤；每次重驗，設次數上限</text>
<g id="concept-evidence" class="concept-card flow-node" data-title="原文證據" data-detail="只根據已提供文件與附件擷取。案例原文：品項甲 120、品項乙 80、稅 10、總計 210；另一份文件印刷總計 215。"><rect class="card-bg source-bg" x="80" y="270" width="320" height="165" rx="19"/><g class="card-content"><text class="head" x="108" y="313">① 原文證據</text><text class="body" x="108" y="352">品項 120、80；稅 10</text><text class="key" x="108" y="394">原文總計 210</text></g></g>
<g id="concept-extract" class="concept-card flow-node" data-title="結構化擷取" data-detail="模型第一次回傳 items=[120,80]、tax=10、stated_total=200；這是合法 JSON，仍可能把小計誤填為總計。"><rect class="card-bg extract-bg" x="475" y="270" width="330" height="165" rx="19"/><g class="card-content"><text class="head" x="503" y="313">② 擷取欄位</text><text class="body" x="503" y="352">items=[120,80]　tax=10</text><text class="warn" x="503" y="394">stated_total=200？</text></g></g>
<g id="concept-structure" class="concept-card flow-node" data-title="第一層：結構檢查" data-detail="檢查預期欄位、型別與合法列舉；嚴格工具輸入或受約束 JSON 可減少形狀錯誤，未啟用時仍需程式驗證。"><rect class="card-bg check-bg" x="900" y="199" width="590" height="81" rx="15"/><g class="card-content"><text class="number" x="925" y="233">第 1 層</text><text class="head" x="1022" y="234">結構</text><text class="body" x="1160" y="234">欄位、型別、列舉</text><text class="small" x="1022" y="263">格式合法，仍不能保證值正確</text></g></g>
<g id="concept-source-check" class="concept-card flow-node" data-title="第二層：來源檢查" data-detail="核對每個擷取值是否能對回原文位置，是否誤認其他欄位；缺值時確認全文與可用附件是否包含資訊。"><rect class="card-bg check-bg" x="900" y="300" width="590" height="81" rx="15"/><g class="card-content"><text class="number" x="925" y="334">第 2 層</text><text class="head" x="1022" y="335">來源</text><text class="body" x="1160" y="335">原文位置、欄位對應</text><text class="small" x="1022" y="364">200 是小計；原文總計明寫 210</text></g></g>
<g id="concept-semantics" class="concept-card flow-node" data-title="第三層：語意檢查" data-detail="在完整品項與費用已知時比較數字關係，也核對幣別、日期先後及業務條件；數值不一致可能是擷取錯誤，也可能是來源衝突。"><rect class="card-bg check-bg" x="900" y="401" width="590" height="81" rx="15"/><g class="card-content"><text class="number" x="925" y="435">第 3 層</text><text class="head" x="1022" y="436">語意</text><text class="body" x="1160" y="436">數字關係、業務條件</text><text class="key" x="1022" y="465">120 + 80 + 10 = 210</text></g></g>
<g id="concept-triage" class="concept-card flow-node" data-title="驗證分流" data-detail="通過者送下游。失敗者先辨認可修正擷取錯誤、來源缺失或來源本身衝突；不能把所有失敗一律交給模型重試。"><rect class="card-bg" x="985" y="572" width="305" height="124" rx="19"/><g class="card-content"><text class="head" x="1013" y="614">③ 驗證分流</text><text class="body" x="1013" y="653">錯因決定下一步</text></g></g>
<g id="concept-pass" class="concept-card flow-node" data-title="通過後交下游" data-detail="模型修正 stated_total=210，程式重新計算 calculated_total=210、conflict_detected=false，三層驗證通過後才可交下游。"><rect class="card-bg pass-bg" x="1330" y="572" width="185" height="124" rx="19"/><g class="card-content"><text class="head" x="1356" y="615">通過</text><text class="body" x="1356" y="653">交下游</text></g></g>
<g id="concept-recoverable" class="concept-card flow-node" data-title="可修正：有限重試" data-detail="原文有總計 210，模型卻擷取成 200。將原文件、第一次輸出和『品項 120+80+稅 10=210；原文總計 210，但 stated_total=200』一併回饋。修正後重新驗證；同錯反覆、變得更不一致或達上限即停止。"><rect class="card-bg repair-bg" x="80" y="848" width="420" height="280" rx="20"/><g class="card-content"><text class="head" x="108" y="895">可修正 → 有限重試</text><text class="body" x="108" y="935">原文明寫 210，擷取卻填 200</text><text class="body" x="108" y="971">指出欄位與加總差異</text><text class="key" x="108" y="1013">只修總額 → 重驗整筆</text><text class="small" x="108" y="1053">同錯再現／更不一致／達上限：停</text><text class="small" x="108" y="1084">每次都回原文，不只說「再試一次」</text></g></g>
<g id="concept-missing" class="concept-card flow-node" data-title="來源缺失：補件或保留缺值" data-detail="來源未提供總計或合約付款日只在未附的附件 B，就保留 stated_total=null 並索取資料；重試不能生出來源資訊。items=[] 若只是未辨識、tax=null 表示未知時，calculated_total=null、conflict_detected=null（無法比較），不能把未知當 0 或 false。"><rect class="card-bg missing-bg" x="590" y="848" width="420" height="280" rx="20"/><g class="card-content"><text class="head" x="618" y="895">來源缺失 → 補件</text><text class="body" x="618" y="935">原文沒總計／附件 B 未提供</text><text class="body" x="618" y="971">stated_total=null</text><text class="warn" x="618" y="1013">items=[]、tax=null ≠ 0</text><text class="small" x="618" y="1053">不能計算時：calculated_total=null</text><text class="small" x="618" y="1084">conflict_detected=null（無法比較）</text></g></g>
<g id="concept-conflict" class="concept-card flow-node" data-title="來源衝突：保留雙值交人工" data-detail="品項 120、80、稅 10 已完整，但原文印刷總計 215。應保留 stated_total=215 與 calculated_total=210，標記 conflict_detected=true，交人工核對；重試不應悄悄把原文值改成 210。"><rect class="card-bg conflict-bg" x="1100" y="848" width="420" height="280" rx="20"/><g class="card-content"><text class="head" x="1128" y="895">來源衝突 → 人工核對</text><text class="body" x="1128" y="935">印刷總計 215；計算為 210</text><text class="body" x="1128" y="971">stated_total=215</text><text class="body" x="1128" y="1005">calculated_total=210</text><text class="warn" x="1128" y="1043">conflict_detected=true</text><text class="small" x="1128" y="1084">保留雙值，不能默改原文 215</text></g></g>
<g id="concept-review-feedback" class="concept-card" data-title="審查駁回的模式回饋" data-detail="程式碼審查駁回時，記錄 detected_pattern、駁回原因與證據。若 bare_catch 常因上游已有統一記錄而被駁回，下一版提示要先追查上游；模式欄位方便聚合，不能取代漏洞證據。"><rect class="card-bg note-bg" x="80" y="1320" width="1440" height="100" rx="16"/><g class="card-content"><text class="head" x="108" y="1360">審查駁回：detected_pattern＋駁回理由＋證據</text><text class="body" x="108" y="1395">例：bare_catch 常因上游已有統一記錄被駁回 → 提示先追查上游，再報同類問題。</text></g></g>
</svg>
