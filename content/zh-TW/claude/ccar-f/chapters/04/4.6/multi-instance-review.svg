<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1310" role="img" aria-labelledby="title desc"><title id="title">4.6 多實例與多輪審查架構</title><desc id="desc">獨立審查者與逐檔/跨檔兩輪是正交維度；退款跨檔案例揭露授權缺口，生成、批評、修訂、複驗形成閉環。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173047}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#506a7b}.section-bg{fill:#f2f7fb;stroke:#c5d8e3;stroke-width:2}.card-bg{fill:#fff;stroke:#abc6d5;stroke-width:2}.head{font-size:22px;font-weight:700;fill:#123b59}.body{font-size:18px}.small{font-size:16px}.flow-line{fill:none;stroke:#267da8;stroke-width:4;marker-end:url(#a)}.blue{fill:#e5f1fa}.green{fill:#e4f5eb}.amber{fill:#fff3d9}.red{fill:#fff0e8}.retry{stroke:#318362;stroke-dasharray:9 7}@keyframes dash{to{stroke-dashoffset:-32}}.retry{animation:dash 2.5s linear infinite}@media (prefers-reduced-motion:reduce){.retry{animation:none}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#267da8"/></marker></defs>
<text x="48" y="62" class="title">4.6 審查品質取決於兩個正交維度</text><text x="48" y="94" class="sub">換誰來看：減少生成脈絡偏誤；怎麼分輪看：兼顧局部細節與跨檔契約</text>
<g id="section-matrix" class="section"><rect class="section-bg" x="40" y="128" width="1120" height="357" rx="22"/><g class="section-content"><text x="65" y="167" class="head">審查設計矩陣</text><text x="70" y="236" class="body">誰來看 ↓　　怎麼看 →</text><text x="466" y="236" class="head">逐檔局部輪</text><text x="831" y="236" class="head">跨檔整合輪</text>
<text x="79" y="315" class="body">生成者自審</text><text x="79" y="415" class="body">獨立實例</text>
<g id="concept-self-local" class="concept-card" data-title="自審與局部輪" data-detail="能找部分語法或局部錯誤，但生成時的假設仍留在脈絡中。"><rect class="card-bg amber" x="362" y="260" width="333" height="101" rx="15"/><g class="card-content"><text x="383" y="302" class="head">可能抓局部錯誤</text><text x="383" y="337" class="small">仍帶生成時的假設</text></g></g>
<g id="concept-self-cross" class="concept-card" data-title="自審與跨檔輪" data-detail="會看資料流，但同一會話仍可能把原設計前提當成已證明事實。"><rect class="card-bg amber" x="733" y="260" width="385" height="101" rx="15"/><g class="card-content"><text x="754" y="302" class="head">視野較廣，偏誤仍在</text><text x="754" y="337" class="small">加思考時間不會移除原脈絡</text></g></g>
<g id="concept-independent-local" class="concept-card" data-title="獨立局部審查" data-detail="新實例只拿需求、差異、測試及專案約束，逐檔檢查分支、錯誤處理、驗證與副作用。"><rect class="card-bg blue" x="362" y="376" width="333" height="79" rx="15"/><g class="card-content"><text x="383" y="424" class="head">可質疑局部假設</text></g></g>
<g id="concept-independent-cross" class="concept-card" data-title="獨立跨檔整合審查" data-detail="獨立實例追入口、服務、儲存到回應的欄位、授權、交易與錯誤傳播；局部發現作線索，但要重新驗證。"><rect class="card-bg green" x="733" y="376" width="385" height="79" rx="15"/><g class="card-content"><text x="754" y="424" class="head">最能抓跨檔契約漏洞</text></g></g></g></g>
<g id="section-example" class="section"><rect class="section-bg" x="40" y="506" width="1120" height="328" rx="22"/><g class="section-content"><text x="65" y="545" class="head">退款案例｜登入不等於對該筆退款有所有權</text>
<g id="concept-api" class="concept-card flow-node" data-title="api.py" data-detail="驗證使用者已登入，將 account_id 與 refund_id 傳入服務層；登入只是身分確認。"><rect class="card-bg blue" x="65" y="594" width="285" height="135" rx="16"/><g class="card-content"><text x="87" y="634" class="head">api.py｜登入</text><text x="87" y="680" class="body">account_id ＋ refund_id</text></g></g><path class="flow-line" d="M350 661 H407"/>
<g id="concept-refund" class="concept-card flow-node" data-title="refund.py" data-detail="接收並傳遞參數，更新退款狀態；需確認授權資訊一直到查詢層仍被使用。"><rect class="card-bg" x="411" y="594" width="285" height="135" rx="16"/><g class="card-content"><text x="433" y="634" class="head">refund.py｜傳遞</text><text x="433" y="680" class="body">服務層看似正確</text></g></g><path class="flow-line" d="M696 661 H753"/>
<g id="concept-store" class="concept-card flow-node" data-title="store.py" data-detail="查詢只按 refund_id，沒用 account_id 限定；A 可猜中 B 的 refund_id 並更動 B 的退款。應雙鍵查詢並加跨帳戶拒絕測試。"><rect class="card-bg red" x="757" y="594" width="377" height="135" rx="16"/><g class="card-content"><text x="779" y="634" class="head">store.py｜權限缺口</text><text x="779" y="680" class="body">只查 refund_id，未限 account_id</text></g></g>
<text x="69" y="793" class="body">逐檔各自「看起來正常」；跨檔追蹤才發現 account_id 在儲存層消失。</text></g></g>
<g id="section-review-loop" class="section"><rect class="section-bg" x="40" y="855" width="1120" height="370" rx="22"/><g class="section-content"><text x="65" y="894" class="head">審查閉環｜獨立性與分輪只是找問題，修訂後仍要重新驗證</text>
<path class="flow-line" d="M309 1000 H335"/><path class="flow-line" d="M462 1081 V1112 H665 V1085"/><path class="flow-line" d="M462 931 V919 H1010 V927"/><path class="flow-line" d="M859 1000 H885"/><path class="flow-line retry" d="M1010 1081 V1149 H734 V1085"/><text x="510" y="1136" class="sub">有缺口</text><text x="924" y="911" class="sub">無缺口</text>
<g id="concept-generate" class="concept-card flow-node" data-title="生成者產生候選程式" data-detail="生成者依需求與專案約束寫出候選變更，提供差異、相關檔案與測試結果給獨立審查者，不提供自我辯護或生成推理。"><rect class="card-bg blue" x="65" y="931" width="244" height="150" rx="16"/><g class="card-content"><text x="85" y="972" class="head">① 生成候選</text><text x="85" y="1015" class="body">需求＋程式差異</text><text x="85" y="1051" class="small">生成者提出變更</text></g></g>
<g id="concept-critique" class="concept-card flow-node" data-title="獨立審查者提出結構化批評" data-detail="獨立實例依同一清單做逐檔與跨檔審查，回報位置、觸發條件、證據、失敗檢查項及修正建議。"><rect class="card-bg amber" x="340" y="931" width="244" height="150" rx="16"/><g class="card-content"><text x="360" y="972" class="head">② 獨立批評</text><text x="360" y="1015" class="body">位置＋條件＋證據</text><text x="360" y="1051" class="small">同清單判 PASS／缺口</text></g></g>
<g id="concept-revise" class="concept-card flow-node" data-title="生成者依批評修訂" data-detail="生成者逐項回應具體批評，修訂程式並補上拒絕與正常路徑測試；若重複出現同類問題，也應修正需求或生成指示。"><rect class="card-bg blue" x="615" y="931" width="244" height="150" rx="16"/><g class="card-content"><text x="635" y="972" class="head">③ 定向修訂</text><text x="635" y="1015" class="body">依發現修程式</text><text x="635" y="1051" class="small">補拒絕與正常測試</text></g></g>
<g id="concept-verify" class="concept-card flow-node" data-title="再驗證後才交付" data-detail="以相同清單、具體拒絕與正常回歸測試核對修訂是否消除問題且未引入新錯。未通過回到定向修訂，通過後才交付。"><rect class="card-bg green" x="890" y="931" width="244" height="150" rx="16"/><g class="card-content"><text x="910" y="972" class="head">④ 複驗放行</text><text x="910" y="1015" class="body">同清單＋回歸測試</text><text x="910" y="1051" class="small">通過才交付</text></g></g>
<text x="766" y="1181" class="sub">未通過／新回歸 → 回到修訂</text>
</g></g><text x="48" y="1270" class="sub">審查者信心只能用來分流，重要發現仍需測試或人工驗證；雙維度增加成本，按風險使用。</text></svg>
