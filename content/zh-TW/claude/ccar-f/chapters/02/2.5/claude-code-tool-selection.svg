<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1250" role="img" aria-label="2.5 依問題選 Glob 或 Grep，逐層 Read 和搜尋別名，最後安全修改並用 Bash 驗證">
<title>2.5 六種內建工具的任務路徑</title>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" style="fill:none;stroke:#327d9d;stroke-width:2;stroke-linejoin:round"/></marker></defs>
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#1a3549}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#577082}.st{font-size:23px;font-weight:700}.ct{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:15px;fill:#526a7c}.mono{font-family:Consolas,'Microsoft JhengHei',monospace;font-size:18px}.panel{fill:#f4f8fb;stroke:#d3e1ea;stroke-width:2}.card{fill:#fff;stroke:#afc8d8;stroke-width:2}.blue{fill:#e9f3fa;stroke:#9fc2d8;stroke-width:2}.green{fill:#e9f6ef;stroke:#84bea4;stroke-width:2}.gold{fill:#fff3e4;stroke:#e0b47c;stroke-width:2}.line{fill:none;stroke:#327d9d;stroke-width:3;marker-end:url(#a)}.plain{fill:none;stroke:#327d9d;stroke-width:3}.divider{stroke:#ccdee8;stroke-width:2}.warn{fill:#a65b34}.good{fill:#23755b}</style>
<rect width="1440" height="1250" style="fill:#fff"/>
<text x="50" y="58" class="title">2.5　從定位檔案到確認真正的呼叫端</text>
<text x="50" y="91" class="sub">先判斷要找「路徑」還是「內容」；命中之後沿匯出與包裝鏈讀懂，再安全修改</text>
<g id="section-search" class="section"><rect class="panel" x="40" y="118" width="1360" height="288" rx="22"/><g class="section-content">
<text x="66" y="157" class="st">① 先分流問題：不要把路徑比對與內容搜尋混在一起</text>
<g id="concept-question" class="concept-card flow-node" data-title="先問要找什麼" data-detail="要找檔名或路徑模式，選 Glob；要找函式名稱、錯誤字串、匯入或呼叫點，選 Grep。兩者的輸出都是候選，不等於已理解程式流程。"><rect class="card" x="66" y="190" width="286" height="141" rx="16"/><g class="card-content"><text x="88" y="234" class="ct">我要找什麼？</text><text x="88" y="273" class="body">路徑，還是檔案內容？</text></g></g>
<path class="line" d="M352 230H403"/><path class="line" d="M352 293H377V341H403"/>
<g id="concept-glob" class="concept-card flow-node" data-title="Glob 找路徑" data-detail="Glob 只比對檔名與路徑，例如 **/*.test.tsx，用來縮小可能的測試檔範圍；找到檔案後仍須讀取內容。"><rect class="blue" x="403" y="185" width="418" height="93" rx="15"/><g class="card-content"><text x="425" y="225" class="ct">Glob｜找路徑</text><text x="425" y="256" class="mono">**/*.test.tsx</text></g></g>
<g id="concept-grep" class="concept-card flow-node" data-title="Grep 搜內容" data-detail="Grep 搜函式名、錯誤訊息、匯入和呼叫點；命中一個名稱不代表找到了所有包裝後的公開名稱。"><rect class="blue" x="403" y="295" width="418" height="93" rx="15"/><g class="card-content"><text x="425" y="335" class="ct">Grep｜搜內容</text><text x="425" y="366" class="body">函式名、錯誤字串、匯入</text></g></g>
<path class="plain" d="M821 231H863V286"/><path class="plain" d="M821 341H863V286"/><path class="line" d="M863 286H908"/>
<g id="concept-candidates" class="concept-card flow-node" data-title="候選不等於結論" data-detail="Glob 的路徑命中與 Grep 的內容命中只是候選。需使用 Read 確認它們是否在實際執行路徑、是否屬於目標通道。"><rect class="green" x="908" y="216" width="466" height="135" rx="16"/><g class="card-content"><text x="930" y="258" class="ct good">得到候選，再讀上下文</text><text x="930" y="297" class="body">命中 ≠ 實際呼叫處／測試覆蓋</text></g></g>
</g></g>
<g id="section-trace" class="section"><rect class="panel" x="40" y="424" width="1360" height="290" rx="22"/><g class="section-content">
<text x="66" y="463" class="st">② 漸進追蹤：原始名稱可能不是畫面呼叫的名稱</text>
<g id="concept-read-definition" class="concept-card flow-node" data-title="Read 定義和匯出" data-detail="先 Read 搜到的實作與匯入/再匯出檔，確認原始函式如何經過包裝模組與公開 API，不能一開始全庫讀完。"><rect class="card" x="66" y="493" width="342" height="151" rx="16"/><g class="card-content"><text x="88" y="535" class="ct">Read｜讀入口與匯出</text><text x="88" y="575" class="mono">chargeCard</text><text x="88" y="610" class="small">確認函式與檔案關係</text></g></g>
<path class="line" d="M408 569H448"/>
<g id="concept-wrapper" class="concept-card flow-node" data-title="Read 包裝與別名" data-detail="讀 payments/index.ts 和 billing/adapter.ts，可見 chargeCard 再匯出並包成 submitPayment，最後對外用 pay；不同公開名稱要逐一記下。"><rect class="blue" x="448" y="493" width="466" height="151" rx="16"/><g class="card-content"><text x="470" y="535" class="ct">Read｜沿包裝鏈追蹤</text><text x="470" y="575" class="mono">chargeCard → submitPayment → pay</text><text x="470" y="610" class="small">列出所有對外名稱，不只記第一個命中</text></g></g>
<path class="line" d="M914 569H954"/>
<g id="concept-grep-alias" class="concept-card flow-node" data-title="Grep 搜每個公開名稱" data-detail="分別在整個程式庫搜尋 chargeCard、submitPayment 和 pay，才能找出只呼叫 pay 的 UI 與其他包裝層；再 Read 判斷哪些呼叫端屬於目標路徑。"><rect class="green" x="954" y="493" width="420" height="151" rx="16"/><g class="card-content"><text x="976" y="535" class="ct good">Grep｜再搜所有別名</text><text x="976" y="575" class="body">找到 pay 的 UI 呼叫端</text><text x="976" y="610" class="small">逐一 Read 確認執行路徑</text></g></g>
<text x="66" y="681" class="body">例：只搜尋 chargeCard，會漏掉只使用 pay 的畫面；找到同字串，也不表示每處都要修改。</text>
</g></g>
<g id="section-change" class="section"><rect class="panel" x="40" y="732" width="1360" height="357" rx="22"/><g class="section-content">
<text x="66" y="771" class="st">③ 修改前先判斷：舊文字能唯一定位嗎？</text>
<g id="concept-unique" class="concept-card" data-title="唯一錨點用 Edit" data-detail="若目標舊文字或更長的上下文在檔案中唯一，Edit 做局部修改，避免全檔覆寫。付款逾時例子只改卡片通道。"><rect class="green" x="66" y="803" width="622" height="160" rx="16"/><g class="card-content"><text x="90" y="845" class="ct good">能唯一定位 → Edit</text><text x="90" y="887" class="body">局部改卡片通道，不動其他付款通道</text><text x="90" y="924" class="small">先確認原檔目前狀態，修改後核對差異</text></g></g>
<g id="concept-not-unique" class="concept-card" data-title="不唯一先 Read 再必要時 Write" data-detail="相同舊文字出現多次時先 Read 全檔，嘗試較長的唯一上下文；仍不可靠才以 Write 寫入完整新檔。寫入前重新核對是否有他人修改，保留無關內容並檢查差異。"><rect class="gold" x="712" y="803" width="662" height="160" rx="16"/><g class="card-content"><text x="736" y="845" class="ct warn">不唯一 → Read 全檔；必要時 Write</text><text x="736" y="887" class="body">先收窄錨點；仍不可靠才完整寫回</text><text x="736" y="924" class="small">重讀最新版本，保留無關內容，防止覆蓋並行變更</text></g></g>
<path class="divider" d="M66 987H1374"/><text x="66" y="1025" class="body">切忌：因 Edit 匹配失敗，就直接全部替換或拿過時版本覆寫整檔。</text>
</g></g>
<g id="section-verify" class="section"><rect class="panel" x="40" y="1107" width="1360" height="103" rx="21"/><g class="section-content"><g id="concept-bash" class="concept-card" data-title="Bash 驗證結果" data-detail="修改後用 Bash 執行相關測試與建置，檢查公開入口 pay 和畫面是否真的使用新分支。Bash 用於需要執行命令的工作，不代替簡單的路徑或內容搜尋。"><text x="66" y="1150" class="st">④ Bash｜執行相關測試與建置，確認 pay 等公開入口真的走到新分支</text><text x="66" y="1182" class="small">Bash 的作用範圍較廣；簡單的找路徑／搜內容仍用 Glob／Grep。</text></g></g></g>
</svg>
