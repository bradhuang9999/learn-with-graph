<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1120" role="img" aria-label="長對話中先擷取事實、持久保存、再於每輪注入與核對的閉環">
<style>
text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#173447}.title{font-size:33px;font-weight:700}.subtitle{font-size:18px;fill:#577080}.h{font-size:23px;font-weight:700}.body{font-size:19px}.note{font-size:16px}.tiny{font-size:15px}.section-bg{fill:#f4f8f9;stroke:#d2e3e6;stroke-width:2}.card-bg{fill:#fff;stroke:#adced5;stroke-width:2}.flow-line{fill:none;stroke:#247d90;stroke-width:3;marker-end:url(#arrow)}.return{fill:none;stroke:#c17a3b;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#orange-arrow);animation:flow 2.5s linear infinite}.accent{fill:#08667b;font-weight:700}.warning{fill:#9d4d35;font-weight:700}.pill{fill:#e2f2f4}.store{fill:#e7f4ed;stroke:#65a987}.storetext{fill:#216b49}.muted{fill:#58727c}@keyframes flow{to{stroke-dashoffset:-36}}@media(prefers-reduced-motion:reduce){.return{animation:none}}
</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#247d90"/></marker><marker id="orange-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c17a3b"/></marker></defs>
<rect width="1440" height="1120" style="fill:#fff;"/><text x="52" y="64" class="title">5.1　先保存精確事實，再壓縮對話</text><text x="52" y="100" class="subtitle">長互動的關鍵不是摘要越長越好，而是下一輪仍能讀回正確的值、來源與未決問題。</text>
<g id="section-loop" class="section"><rect class="section-bg" x="42" y="132" width="1356" height="632" rx="24"/><g class="section-content"><text x="70" y="174" class="h">五個環節如何閉合</text><text x="70" y="203" class="note muted">回合原文進來後先擷取；資料只存外部卻未放進本輪請求，模型仍看不到。</text>
<path class="flow-line" d="M310 318H366"/><path class="flow-line" d="M651 318H710"/><path class="flow-line" d="M990 318H1050"/>
<path class="flow-line" d="M1208 404V479H1036"/><path class="flow-line" d="M869 570H682"/><path class="flow-line" d="M516 570H326"/>
<path class="return" d="M176 661V714H55V323H70"/><text x="190" y="708" class="tiny" style="fill:#a9652e;">新回合／資料更正 → 回到原始輸入，再核對</text>
<g id="concept-source" class="concept-card flow-node" data-title="回合與原始工具結果" data-detail="保留客戶原話、訂單查詢與來源位置；先擷取精確值，不能先把原文壓成籠統摘要。"><rect class="card-bg" x="70" y="245" width="240" height="160" rx="16"/><g class="card-content"><text x="90" y="281" class="h">原始輸入</text><text x="90" y="318" class="body">A-71：NT$2,480</text><text x="90" y="349" class="note">客戶希望週五前退款</text><text x="90" y="378" class="tiny muted">原話 ≠ 已承諾期限</text></g></g>
<g id="concept-extract" class="concept-card flow-node" data-title="一、先擷取" data-detail="在摘要前擷取識別碼、金額、日期、狀態、客戶期待與決策；缺值標為未知。"><rect class="card-bg" x="366" y="245" width="285" height="160" rx="16"/><g class="card-content"><text x="387" y="281" class="h accent">① 先擷取</text><text x="387" y="319" class="body">精確值＋來源＋時間</text><text x="387" y="350" class="note">缺值標未知，不猜補</text><text x="387" y="378" class="tiny muted">先於任何滾動摘要</text></g></g>
<g id="concept-update" class="concept-card flow-node" data-title="二、更新與驗證" data-detail="核對型別、範圍與原話；新舊值衝突時記錄來源，按歷史是否重要選追加或取代，重大衝突不可靜默覆寫。"><rect class="card-bg" x="710" y="245" width="280" height="160" rx="16"/><g class="card-content"><text x="731" y="281" class="h accent">② 更新、驗證</text><text x="731" y="319" class="body">比較新舊值與來源</text><text x="731" y="350" class="note">重大衝突先回查</text><text x="731" y="378" class="tiny warning">不靜默覆寫</text></g></g>
<g id="concept-store" class="concept-card flow-node" data-title="持久保存與容量管理" data-detail="案件事實與議題狀態持久保存，按案件索引；合併重複、標示時效、設容量預算，刪除前確保可回查原始資料。"><rect class="card-bg store" x="1050" y="245" width="318" height="160" rx="16"/><g class="card-content"><text x="1073" y="281" class="h storetext">持久案件狀態</text><text x="1073" y="319" class="body">事實區＋各議題進度</text><text x="1073" y="350" class="note">④ 管容量、時效與版本</text><text x="1073" y="378" class="tiny muted">跨會話保留；保住回查路徑</text></g></g>
<g id="concept-inject" class="concept-card flow-node" data-title="三、注入當次請求與五、要求查閱" data-detail="依案件與本輪任務取回已核實事實、問題狀態、滾動摘要與近期原話；明示答前核對事實區，區分期待與承諾。"><rect class="card-bg" x="869" y="479" width="499" height="182" rx="16"/><g class="card-content"><text x="891" y="517" class="h accent">③ 注入當次請求</text><text x="891" y="552" class="body">事實區｜問題狀態｜滾動摘要</text><text x="891" y="583" class="note">⑤ 明示答前核對事實；近期原話另附</text><text x="891" y="615" class="tiny warning">資料只在庫裡而沒注入＝模型看不到</text></g></g>
<g id="concept-answer" class="concept-card flow-node" data-title="核對後回答" data-detail="模型需按指示查閱事實區；遇到未知、過期或衝突，查證或說明不確定，不能把客戶期望轉成公司承諾。"><rect class="card-bg" x="326" y="479" width="356" height="182" rx="16"/><g class="card-content"><text x="347" y="517" class="h">答覆前核對</text><text x="347" y="552" class="body">未知／衝突 → 查證</text><text x="347" y="584" class="note">週五是客戶期待，非保證</text><text x="347" y="615" class="tiny muted">有依據才答；必要時帶不確定性</text></g></g>
<g id="concept-output" class="concept-card flow-node" data-title="分項答覆與下一步" data-detail="答覆分別處理 A-71 退款與 B-24 出貨；新增回合及工具結果再次進入擷取循環。"><rect class="card-bg" x="70" y="479" width="256" height="182" rx="16"/><g class="card-content"><text x="91" y="517" class="h">分項答覆</text><text x="91" y="553" class="body">A-71：待核對</text><text x="91" y="584" class="body">B-24：已出貨</text><text x="91" y="615" class="tiny muted">記下未決問題與下一步</text></g></g>
</g></g>
<g id="section-trim" class="section"><rect class="section-bg" x="42" y="789" width="1356" height="276" rx="24"/><g class="section-content"><text x="70" y="832" class="h">兩個減噪閘門：保留能核對的訊號</text>
<path class="flow-line" d="M367 920H420"/><path class="flow-line" d="M886 920H936"/>
<g id="concept-tool-trim" class="concept-card" data-title="工具結果進入上下文前裁切" data-detail="在工具包裝層由 43 欄裁成與任務相關的 5 欄，另保留來源與裁切記錄；固定結構可過濾，動態結構可摘要，超大原文可留參照。"><rect class="card-bg" x="70" y="862" width="297" height="171" rx="16"/><g class="card-content"><text x="92" y="900" class="h accent">工具包裝層</text><text x="92" y="936" class="body">43 欄 → 所需 5 欄</text><text x="92" y="967" class="note">另存原文與裁切記錄</text><text x="92" y="999" class="tiny muted">進模型前裁，不只裁人類介面</text></g></g>
<g id="concept-context" class="concept-card" data-title="聚合輸入結構" data-detail="開頭先列關鍵發現，詳細結果用章節標題分區；防止重要結論埋在長輸入中段。"><rect class="card-bg" x="420" y="862" width="466" height="171" rx="16"/><g class="card-content"><text x="442" y="900" class="h accent">聚合輸入</text><text x="442" y="936" class="body">關鍵發現置前｜細節分區</text><text x="442" y="967" class="note">避免重要訊號埋在中段</text><text x="442" y="999" class="tiny muted">歷史可壓縮；精確事實不可只靠摘要</text></g></g>
<g id="concept-handoff" class="concept-card" data-title="下游交接契約" data-detail="下游預算有限時，上游回傳關鍵事實、短引文、日期、來源位置、示意相關性分數與方法限制；分數只是任務排序而非可信度，區分未找到與未查。"><rect class="card-bg" x="936" y="862" width="432" height="171" rx="16"/><g class="card-content"><text x="958" y="900" class="h accent">下游交接</text><text x="958" y="936" class="body">事實＋短引文＋來源</text><text x="958" y="967" class="note">相關性分數只用來排序</text><text x="958" y="999" class="tiny muted">「未找到」不等於「未查」</text></g></g>
</g></g>
</svg>
