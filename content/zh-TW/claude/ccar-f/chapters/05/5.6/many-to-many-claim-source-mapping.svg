<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1030" role="img" aria-label="一項主張可連多個來源，同一來源可支持多項主張，綜整後保留映射">
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#173447}.title{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#58717e}.h{font-size:23px;font-weight:700}.body{font-size:19px}.note{font-size:16px}.small{font-size:15px}.section-bg{fill:#f3f8f7;stroke:#d0e3dd;stroke-width:2}.card-bg{fill:#fff;stroke:#a7ccbc;stroke-width:2}.source{fill:#e7f4ed}.claim{fill:#e8f3f7;stroke:#93bfd0}.derived{fill:#fff4e5;stroke:#d9b67a}.flow-line{fill:none;stroke:#37856d;stroke-width:3;marker-end:url(#arrow)}.derived-line{fill:none;stroke:#bd7b36;stroke-width:3;marker-end:url(#orange-arrow)}.label{font-size:15px;fill:#276a53}.accent{fill:#146e58;font-weight:700}.warning{fill:#985c21;font-weight:700}.muted{fill:#5e7680}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#37856d"/></marker><marker id="orange-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd7b36"/></marker></defs>
<rect width="1500" height="1030" style="fill:#fff;"/>
<text x="50" y="63" class="title">5.6　引用不是文末網址清單，而是主張與來源的連線</text>
<text x="50" y="101" class="subtitle">教學示意：C01 有兩個來源；S01 同時支持 C01、C02。綜整成 82% 後，不能丟掉這些邊。</text>
<g id="section-map" class="section"><rect class="section-bg" x="40" y="135" width="1420" height="573" rx="24"/><g class="section-content"><text x="70" y="179" class="h">多對多映射：先存每條「支持」邊，再形成新主張</text>
<text x="88" y="219" class="note muted">來源與定位</text><text x="587" y="219" class="note muted">可核對的基礎主張</text><text x="1120" y="219" class="note muted">衍生主張</text>
<path class="flow-line" d="M420 306H580"/><path class="flow-line" d="M420 357H500V504H580"/><path class="flow-line" d="M420 537H580"/>
<path class="derived-line" d="M970 320H1030V396H1100"/><path class="derived-line" d="M970 507H1030V435H1100"/>
<text x="444" y="292" class="label">結案欄 820</text><text x="500" y="472" class="label">申請欄 1,000</text><text x="434" y="524" class="label">稽核申請 1,000</text>
<g id="concept-source-s01" class="concept-card flow-node" data-title="S01 第二季財務表" data-detail="假設的第二季財務表，保留文件名稱、網址、版本、資料日期與欄位定位；申請欄 1000 件支持 C01，結案欄 820 件支持 C02。"><rect class="card-bg source" x="70" y="247" width="350" height="175" rx="17"/><g class="card-content"><text x="93" y="286" class="h accent">S01｜第二季財務表</text><text x="93" y="324" class="body">申請欄：1,000</text><text x="93" y="355" class="body">結案欄：820</text><text x="93" y="391" class="small muted">版本／日期／欄位定位可回查</text></g></g>
<g id="concept-source-s02" class="concept-card flow-node" data-title="S02 第二季稽核匯出" data-detail="假設的稽核匯出，申請總數欄 1000 件支持 C01。須查生成方法：若只是複製 S01，不能算獨立證據。"><rect class="card-bg source" x="70" y="461" width="350" height="175" rx="17"/><g class="card-content"><text x="93" y="500" class="h accent">S02｜第二季稽核匯出</text><text x="93" y="539" class="body">申請總數：1,000</text><text x="93" y="574" class="note warning">須驗是否獨立於 S01</text><text x="93" y="606" class="small muted">複製來源 ≠ 第二份獨立證據</text></g></g>
<g id="concept-claim-c02" class="concept-card flow-node" data-title="C02 第二季已結案退款 820 件" data-detail="C02 由 S01 的已結案欄支持；不能因 S02 支持 C01，就把 S02 錯掛到 C02。"><rect class="card-bg claim" x="580" y="251" width="390" height="135" rx="17"/><g class="card-content"><text x="604" y="292" class="h">C02｜已結案 820 件</text><text x="604" y="327" class="body">2026 第二季</text><text x="604" y="359" class="small muted">支持來源：S01</text></g></g>
<g id="concept-claim-c01" class="concept-card flow-node" data-title="C01 第二季退款申請 1000 件" data-detail="C01 同時連到 S01 的申請欄和 S02 的申請總數欄；每條邊保留摘錄、定位與版本。"><rect class="card-bg claim" x="580" y="439" width="390" height="135" rx="17"/><g class="card-content"><text x="604" y="480" class="h">C01｜申請 1,000 件</text><text x="604" y="515" class="body">2026 第二季</text><text x="604" y="547" class="small muted">支持來源：S01、S02</text></g></g>
<g id="concept-derived-c03" class="concept-card flow-node" data-title="C03 第二季結案比例 82%" data-detail="C03 由 C02 的 820 件與 C01 的 1000 件推得；應保留分子、分母、期間、計算方法，以及 C01、C02 原有來源邊。若改寫為全年，這些證據不再支持。"><rect class="card-bg derived" x="1100" y="342" width="330" height="190" rx="17"/><g class="card-content"><text x="1123" y="383" class="h warning">C03｜820／1,000</text><text x="1123" y="426" class="h">＝第二季 82%</text><text x="1123" y="465" class="note">保留 C01、C02 的來源邊</text><text x="1123" y="496" class="small muted">不能改寫成「全年」</text></g></g>
<text x="70" y="679" class="note muted">每個 S ID 對應可回查文件／網址、版本、資料日與定位；引用格式正確仍須檢查摘錄是否真正支持主張。</text>
</g></g>
<g id="section-handoff" class="section"><rect class="section-bg" x="40" y="734" width="1420" height="230" rx="24"/><g class="section-content"><text x="70" y="777" class="h">跨代理交接時，連線也要一起傳</text>
<path class="flow-line" d="M439 866H520"/><path class="flow-line" d="M933 866H1014"/>
<g id="concept-child-output" class="concept-card flow-node" data-title="子代理回傳映射" data-detail="子代理輸出主張 ID、內容、來源 ID 集合、文件名稱或 URL、位置、短摘錄、出版日與資料日、方法限制。"><rect class="card-bg" x="70" y="805" width="369" height="129" rx="16"/><g class="card-content"><text x="93" y="847" class="h accent">子代理：回傳映射</text><text x="93" y="884" class="body">C01→S01/S02；C02→S01</text><text x="93" y="913" class="small muted">每邊附摘錄、定位、日期</text></g></g>
<g id="concept-coordinator-merge" class="concept-card flow-node" data-title="協調者核對並保留邊" data-detail="協調者核對來源 ID 存在、摘錄支持主張、S01/S02 是否獨立；合併發現時保留所有可追溯映射，不能平均或替換相互衝突的值。"><rect class="card-bg" x="520" y="805" width="413" height="129" rx="16"/><g class="card-content"><text x="543" y="847" class="h accent">協調者：核對並合併</text><text x="543" y="884" class="body">不丟來源邊；核對獨立性</text><text x="543" y="913" class="small muted">衝突先標記，再定調和規則</text></g></g>
<g id="concept-synthesis-report" class="concept-card flow-node" data-title="綜整報告保留可核對引用" data-detail="財務數值適合表格，主張旁保留來源與限制；新聞脈絡可敘述，技術發現可用清單。若後續出現同口徑真衝突，並列雙值及來源，不可悄悄選一個。"><rect class="card-bg" x="1014" y="805" width="416" height="129" rx="16"/><g class="card-content"><text x="1037" y="847" class="h accent">綜整：報告仍可回查</text><text x="1037" y="884" class="body">財務表格列值、期間、來源</text><text x="1037" y="913" class="small muted">有爭議的值另列，不平均</text></g></g>
</g></g>
</svg>
