<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1530" role="img" aria-labelledby="title desc">
<title id="title">5.3 多代理錯誤傳播：保留成功證據與揭露覆蓋缺口</title><desc id="desc">單次查詢分成功、有效空結果、部分結果、存取失敗四態。一般退款資料查詢成功，官方競品政策庫兩次逾時；政策代理停止局部重試並上報封裝。協調者保留一般退款發現，但暫停競品價差退款結論。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173247}.bg{fill:#f5f8fb}.title{font-size:36px;font-weight:700}.subtitle{font-size:19px;fill:#526b7e}.section-bg{fill:#fff;stroke:#d2e1e9;stroke-width:2}.section-label{font-size:18px;font-weight:700;fill:#55738b}.card-bg{fill:#fff;stroke:#a9c3d3;stroke-width:2.5}.green-bg{fill:#e6f5ec;stroke:#6bb18b}.red-bg{fill:#fff0ec;stroke:#d48a7b}.blue-bg{fill:#e8f1fa;stroke:#74a7c6}.amber-bg{fill:#fff4df;stroke:#d4ad66}.handoff-bg{fill:#f3effb;stroke:#9b8cca}.head{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#536d80}.code{font-size:20px;font-weight:700;fill:#255b7b}.state-head{font-size:19px;font-weight:700}.state-body{font-size:17px}.good{font-size:21px;font-weight:700;fill:#1a7953}.bad{font-size:21px;font-weight:700;fill:#a54a40}.warn{font-size:19px;font-weight:700;fill:#a06322}.flow-line{fill:none;stroke:#6c889d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.branch-line{fill:none;stroke:#6c889d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.retry-line{fill:none;stroke:#ba7b35;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#amber-arrow)}.error-line{fill:none;stroke:#bb685c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#red-arrow)}.flow-label{font-size:17px;font-weight:700;fill:#536d80}.error-label{font-size:17px;font-weight:700;fill:#a54a40}.concept-card{cursor:pointer}.card-content{pointer-events:none}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" style="fill:#6c889d"/></marker><marker id="amber-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" style="fill:#ba7b35"/></marker><marker id="red-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" style="fill:#bb685c"/></marker></defs>
<rect class="bg" width="1600" height="1530"/>
<text class="title" x="65" y="70">5.3 查不到資料，不能寫成查無資料</text><text class="subtitle" x="65" y="108">失敗狀態要跨代理邊界傳遞；其他已驗證片段仍可保留。</text>
<g id="section-states" class="section"><rect class="section-bg" x="50" y="140" width="1500" height="245" rx="24"/><g class="section-content"><text class="section-label" x="80" y="181">每次查詢的四個互斥狀態：資料筆數與查詢完成度要分開看</text></g></g>
<g id="section-case" class="section"><rect class="section-bg" x="50" y="415" width="1500" height="1050" rx="24"/><g class="section-content"><text class="section-label" x="80" y="455">推演｜一般退款資料成功；官方競品政策查詢兩次逾時</text></g></g>
<!-- Paths precede nodes. The successful order branch and failed policy branch meet only at synthesis. -->
<path class="branch-line" d="M800 605 V668 H320"/>
<path class="flow-line" d="M320 668 V720"/><path class="flow-line" d="M800 668 V720"/>
<path class="retry-line" d="M980 810 H1110"/>
<path class="error-line" d="M1290 900 V963 H1130 V985"/>
<path class="flow-line" d="M320 1020 V1258 H560 V1280"/>
<path class="flow-line" d="M1130 1198 V1258 H1040 V1280"/>
<text class="flow-label" x="117" y="685">一般退款資料成功</text><text class="flow-label" x="682" y="685">競品例外政策查詢</text>
<text class="flow-label" x="986" y="778">安全：只重試 1 次</text>
<text class="error-label" x="1175" y="948">兩次仍逾時：停止</text>

<g id="concept-success" class="concept-card" data-title="success：查詢成功有資料" data-detail="指定範圍查詢完成且取得可核實資料；下游可引用這些結果與來源位置。"><rect class="card-bg green-bg" x="80" y="215" width="330" height="135" rx="18"/><g class="card-content"><text class="state-head good" x="98" y="253">success｜有資料</text><text class="state-body" x="98" y="288">已查完且命中</text><text class="state-body" x="98" y="319">引用已核實發現</text></g></g>
<g id="concept-success-empty" class="concept-card" data-title="success_empty：有效空結果" data-detail="指定範圍查詢成功但零筆符合。只能說已查範圍未找到，不應因空集合盲目重試。"><rect class="card-bg green-bg" x="450" y="215" width="330" height="135" rx="18"/><g class="card-content"><text class="state-head good" x="468" y="253">success_empty｜零筆</text><text class="state-body" x="468" y="288">已查完、確實無命中</text><text class="state-body" x="468" y="319">只說「已查範圍未找到」</text></g></g>
<g id="concept-partial" class="concept-card" data-title="partial：部分結果" data-detail="該次查詢尚未完成，但已有可驗證資料；列出已查與未查頁面，不可把部分資料說成全部。"><rect class="card-bg amber-bg" x="820" y="215" width="330" height="135" rx="18"/><g class="card-content"><text class="state-head warn" x="838" y="253">partial｜有部分資料</text><text class="state-body" x="838" y="288">尚未查完，但可用已有資料</text><text class="state-body" x="838" y="319">標明未涵蓋範圍</text></g></g>
<g id="concept-access-error" class="concept-card" data-title="access_error：存取失敗" data-detail="查詢未完成且沒有可用資料，例如逾時或權限拒絕；不能說資料不存在，應回報失敗類型、範圍與嘗試次數。"><rect class="card-bg red-bg" x="1190" y="215" width="330" height="135" rx="18"/><g class="card-content"><text class="state-head bad" x="1208" y="253">access_error｜失敗</text><text class="state-body" x="1208" y="288">未查完、沒有可用資料</text><text class="state-body" x="1208" y="319">不可寫成「查無」</text></g></g>

<g id="concept-coordinator-request" class="concept-card flow-node" data-title="協調者分派三條調查" data-detail="協調者分派一般退款資料與官方競品政策兩條查詢。各子代理回傳查詢狀態與來源；單一來源失敗不得抹去另一來源成果。"><rect class="card-bg blue-bg" x="575" y="505" width="450" height="100" rx="18"/><g class="card-content"><text class="head" x="608" y="547">協調者：分派兩條查詢</text><text class="body" x="608" y="580">一般退款資料／官方競品政策</text></g></g>
<g id="concept-success-evidence" class="concept-card flow-node" data-title="成功證據保留" data-detail="一般退款資料查詢成功，確認通常退回原付款方式，並保留來源位置。這項成功發現不因另一個官方競品政策來源逾時而消失，但也不能替代該政策的例外規則。"><rect class="card-bg green-bg" x="80" y="720" width="480" height="300" rx="20"/><g class="card-content"><text class="head" x="111" y="768">成功支線：保留已驗證發現</text><text class="good" x="111" y="812">一般退款：退回原付款方式</text><text class="body" x="111" y="855">保留來源：退款資料第 2 節</text><text class="body" x="111" y="905">競品例外尚未得到正式依據</text><text class="small" x="111" y="948">成功片段可用，不代表政策已查完</text><text class="small" x="111" y="983">不能拿一般規則補競品例外缺口</text></g></g>
<g id="concept-timeout-first" class="concept-card flow-node" data-title="第一次逾時：原處安全重試" data-detail="政策代理查官方政策庫的競品價差退款例外，第一次 timeout。這是 access_error 而非有效空結果；在沒有副作用且預算允許時，記錄來源、查詢詞和時間後本地重試一次。"><rect class="card-bg amber-bg" x="620" y="720" width="360" height="180" rx="19"/><g class="card-content"><text class="head" x="649" y="767">政策庫｜第 1 次</text><text class="warn" x="649" y="810">timeout</text><text class="body" x="649" y="851">可安全重試一次</text></g></g>
<g id="concept-timeout-second" class="concept-card flow-node" data-title="第二次仍逾時：停止局部重試" data-detail="政策代理第二次查正式政策庫仍逾時，已達本例預設的兩次嘗試。停止在原處無限重試，把部分已得證據與完整失敗狀態上報協調者。"><rect class="card-bg red-bg" x="1110" y="720" width="380" height="180" rx="19"/><g class="card-content"><text class="head" x="1139" y="767">政策庫｜第 2 次</text><text class="bad" x="1139" y="810">timeout，停止重試</text><text class="body" x="1139" y="851">attempts=2</text></g></g>
<g id="concept-error-handoff" class="concept-card flow-node" data-title="上報失敗封裝與覆蓋缺口" data-detail="官方政策查詢子代理上報 status: access_error、failure_type: timeout、attempts:2、來源及查詢範圍；該次查詢無可用部分結果，不得挪用另一成功支線的發現當作自己查到。coverage_gap 明記『競品價差例外未獲官方政策庫覆蓋』。可建議稍後重試或交人工，不可回 success_empty。"><rect class="card-bg handoff-bg" x="750" y="985" width="740" height="213" rx="20"/><g class="card-content"><text class="head" x="782" y="1027">政策子代理：跨邊界上報</text><text class="code" x="782" y="1066">status: access_error　failure_type: timeout　attempts: 2</text><text class="body" x="782" y="1104">已查：競品例外　該查詢可用部分結果：無</text><text class="bad" x="782" y="1142">coverage_gap：競品例外未查證</text><text class="small" x="782" y="1175">下步：稍後查同等權威來源，或交人工</text></g></g>
<g id="concept-synthesis" class="concept-card flow-node" data-title="協調者整體覆蓋部分、保留成功發現" data-detail="協調者保留一般退款方式的有來源發現；整體任務的 overall_coverage 是 partial，因一支線成功、一支線官方政策查詢 access_error。單次 access_error 不可改寫成單次 partial；競品例外仍未知，不得據此核准競品價差退款，應交人工或延後查證。"><rect class="card-bg blue-bg" x="400" y="1280" width="800" height="165" rx="20"/><g class="card-content"><text class="head" x="435" y="1323">協調者：保留一般退款發現，標明政策缺口</text><text class="code" x="435" y="1359">overall_coverage: partial</text><text class="body" x="435" y="1393">政策單次仍是 access_error；競品退款結論暫停</text><text class="small" x="435" y="1425">不可把來源不可用寫成「政策不存在」</text></g></g>
</svg>
