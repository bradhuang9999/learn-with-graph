<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1490" role="img" aria-labelledby="title desc">
<title id="title">1.7 工作階段續接、分叉與重開的條件決策樹</title><desc id="desc">先列變更、標記受影響結論並定向重讀。證據有效時續接；同一已驗證基線要比較兩案時分叉獨立會話；大量過時時用結構化摘要新開會話。分叉共用外部工作目錄，試改需獨立工作樹。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173247}.bg{fill:#f4f8fb}.title{font-size:36px;font-weight:700}.subtitle{font-size:19px;fill:#516b7e}.section-bg{fill:#fff;stroke:#d2e0e9;stroke-width:2}.section-label{font-size:18px;font-weight:700;fill:#55728a}.card-bg{fill:#fff;stroke:#a9c2d2;stroke-width:2.5}.audit-bg{fill:#e8f1fa;stroke:#6fa3c7}.decision-bg{fill:#183d5e;stroke:#183d5e}.resume-bg{fill:#e5f5eb;stroke:#61ab7c}.restart-bg{fill:#fff1e5;stroke:#dd9d6e}.fork-bg{fill:#edeafa;stroke:#9b8cce}.session-bg{fill:#f1effb;stroke:#9b8cce}.shared-bg{fill:#fff6e1;stroke:#d2ab55}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#536d80}.label{font-size:16px;font-weight:700;fill:#4c6980}.white{fill:#fff}.flow-line{fill:none;stroke:#6c879b;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.fork-line{fill:none;stroke:#7467ae;stroke-width:4;stroke-linejoin:round;marker-end:url(#arrow-purple)}.branch-line{fill:none;stroke:#6c879b;stroke-width:4;stroke-linejoin:round}.shared-line{fill:none;stroke:#c0923f;stroke-width:3;stroke-dasharray:9 7}.concept-card{cursor:pointer}.card-content{pointer-events:none}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" style="fill:#6c879b"/></marker><marker id="arrow-purple" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" style="fill:#7467ae"/></marker></defs>
<rect class="bg" width="1600" height="1490"/>
<text class="title" x="65" y="70">1.7 先驗證舊觀察，再決定如何接續</text><text class="subtitle" x="65" y="107">週五讀過的程式碼，不會因保存會話而凍結週一的檔案。</text>
<g id="section-decision" class="section"><rect class="section-bg" x="50" y="135" width="1500" height="790" rx="24"/><g class="section-content"><text class="section-label" x="80" y="176">決策樹｜先盤點變更，再判斷舊證據是否仍可信</text></g></g>
<g id="section-fork" class="section"><rect class="section-bg" x="50" y="965" width="1500" height="470" rx="24"/><g class="section-content"><text class="section-label" x="80" y="1005">分叉的邊界｜分開的是會話歷史，共用的是外部工作目錄</text></g></g>
<!-- Flow edges remain beneath cards and labels. -->
<path class="flow-line" d="M495 277 H585"/><path class="flow-line" d="M1015 277 H1105"/>
<path class="flow-line" d="M1312 358 V405 H800 V440"/>
<path class="branch-line" d="M800 560 V618 H295"/><path class="branch-line" d="M800 618 H1305"/>
<path class="flow-line" d="M295 618 V660"/><path class="flow-line" d="M800 618 V660"/><path class="flow-line" d="M1305 618 V660"/>
<path class="fork-line" d="M1305 890 V1022 H800 V1050"/>
<path class="fork-line" d="M800 1130 V1161 H450 V1190"/><path class="fork-line" d="M800 1161 H1150 V1190"/>
<path class="shared-line" d="M450 1286 V1320 H800"/><path class="shared-line" d="M1150 1286 V1320 H800"/>
<text class="label" x="145" y="638">核心結果大量過時</text><text class="label" x="656" y="638">沿原問題繼續</text><text class="label" x="1150" y="638">同基線比較兩案</text>

<g id="concept-list-changes" class="concept-card flow-node" data-title="先列變更" data-detail="恢復前列出上次分析後變更的檔案、外部資料與環境；例如週一 auth.ts 的 verifyToken 與相關測試已變。"><rect class="card-bg audit-bg" x="80" y="218" width="415" height="140" rx="18"/><g class="card-content"><text class="head" x="107" y="263">① 先列變更</text><text class="body" x="107" y="303">檔案／外部資料／環境</text><text class="small" x="107" y="332">例：auth.ts 的驗證函式已更新</text></g></g>
<g id="concept-mark-dependent" class="concept-card flow-node" data-title="標記受影響的舊結論" data-detail="把先前結論與當時工具觀察對回變更項，找出哪些假設可能失效；例如 verifyToken 舊回傳型別的判斷。"><rect class="card-bg audit-bg" x="585" y="218" width="430" height="140" rx="18"/><g class="card-content"><text class="head" x="612" y="263">② 標記受影響結論</text><text class="body" x="612" y="303">舊觀察依賴了哪些結果？</text><text class="small" x="612" y="332">例：布林回傳值的舊假設</text></g></g>
<g id="concept-reread" class="concept-card flow-node" data-title="定向重讀" data-detail="變更影響舊結論時，重新讀取受影響檔案及呼叫處、測試和依賴，再決定是否沿用分析；範圍不明時擴大查證。"><rect class="card-bg audit-bg" x="1105" y="218" width="415" height="140" rx="18"/><g class="card-content"><text class="head" x="1132" y="263">③ 定向重讀</text><text class="body" x="1132" y="303">受影響檔案＋依賴</text><text class="small" x="1132" y="332">範圍不明時擴大查證</text></g></g>
<g id="concept-triage" class="concept-card flow-node" data-title="舊證據可信嗎" data-detail="核對現況後，依舊證據有效程度與工作目的分流；節省上下文不是首要判準。"><rect class="card-bg decision-bg" x="600" y="440" width="400" height="120" rx="19"/><g class="card-content"><text class="head white" x="635" y="485">舊證據現在仍可信嗎？</text><text class="body white" x="635" y="525">再看：續做，還是比較方案？</text></g></g>
<g id="concept-restart" class="concept-card flow-node" data-title="大量過時：新會話與結構化摘要" data-detail="核心檔案或先前工具結果大面積失效時，新開工作階段。注入目標、仍有效事實及來源、已變更、待驗證問題與下一步；重新建立可靠基線。"><rect class="card-bg restart-bg" x="80" y="660" width="430" height="230" rx="19"/><g class="card-content"><text class="head" x="107" y="704">大量過時 → 新會話</text><text class="body" x="107" y="744">注入結構化摘要：</text><text class="body" x="107" y="778">目標／仍有效事實與來源</text><text class="body" x="107" y="812">已變更／待驗證／下一步</text><text class="small" x="107" y="856">舊工具輸出不再當現況</text></g></g>
<g id="concept-resume" class="concept-card flow-node" data-title="舊證據有效：續接原問題" data-detail="檔案未變且沿原調查繼續，用 --resume auth-review。局部變更時，先明示變更並定向重讀 auth.ts verifyToken、呼叫處與相關測試，再沿用仍有效的舊背景。"><rect class="card-bg resume-bg" x="585" y="660" width="430" height="230" rx="19"/><g class="card-content"><text class="head" x="612" y="704">舊證據多數有效 → 續接</text><text class="body" x="612" y="744">--resume auth-review</text><text class="body" x="612" y="783">未變：沿已核對線索續做</text><text class="body" x="612" y="820">局部變：定向重讀後續接</text><text class="small" x="612" y="856">不必先重查整座程式庫</text></g></g>
<g id="concept-fork-choice" class="concept-card flow-node" data-title="同一已驗證基線：分叉比較方案" data-detail="需要以同一份已確認分析比較小幅修補與抽換驗證模組時，用 fork_session 開兩條獨立會話；分支各自形成後續探索。"><rect class="card-bg fork-bg" x="1090" y="660" width="430" height="230" rx="19"/><g class="card-content"><text class="head" x="1117" y="704">同基線比兩案 → 分叉</text><text class="body" x="1117" y="744">fork_session</text><text class="body" x="1117" y="783">從已驗證分析開始</text><text class="body" x="1117" y="820">後續會話各自探索</text><text class="small" x="1117" y="856">新增發現仍須各自核對</text></g></g>

<g id="concept-baseline" class="concept-card flow-node" data-title="共同的已驗證會話基線" data-detail="分叉前核實 auth.ts、session.ts 與需求約束。fork_session 讓兩個分支從同一份會話分析出發。"><rect class="card-bg fork-bg" x="555" y="1050" width="490" height="80" rx="16"/><g class="card-content"><text class="head" x="590" y="1099">共同的已驗證會話基線</text></g></g>
<g id="concept-session-a" class="concept-card flow-node" data-title="獨立會話 A：小幅修補" data-detail="第一條分支獨立探索小幅修補的風險與測試需求；其後續對話不覆蓋另一分支。"><rect class="card-bg session-bg" x="210" y="1190" width="480" height="96" rx="17"/><g class="card-content"><text class="head" x="240" y="1230">會話 A｜小幅修補</text><text class="body" x="240" y="1261">獨立分析風險與測試</text></g></g>
<g id="concept-session-b" class="concept-card flow-node" data-title="獨立會話 B：抽換驗證模組" data-detail="第二條分支獨立探索抽換驗證模組的風險與測試需求；兩個分支的新發現不會自動同步。"><rect class="card-bg session-bg" x="910" y="1190" width="480" height="96" rx="17"/><g class="card-content"><text class="head" x="940" y="1230">會話 B｜抽換驗證模組</text><text class="body" x="940" y="1261">獨立分析風險與測試</text></g></g>
<g id="concept-shared-workspace" class="concept-card" data-title="共同外部工作目錄；實際試改需隔離" data-detail="fork_session 只分叉對話與分析歷史，不自動隔離檔案系統、資料庫或服務。若兩條分支都要實際修改 auth.ts，另用獨立 worktree 或隔離環境，各自核對檔案現況。"><rect class="card-bg shared-bg" x="200" y="1320" width="1200" height="88" rx="16"/><g class="card-content"><text class="head" x="230" y="1354">共同外部工作目錄：改同一個 auth.ts 仍會互相影響</text><text class="body" x="230" y="1386">若兩案要同時試改 → 各用獨立 worktree 或隔離環境</text></g></g>
</svg>
