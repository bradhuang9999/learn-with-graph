<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1060" role="img" aria-label="1.6 已知結構用固定兩輪審查，未知依賴用探索與證據回饋重排任務">
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" style="fill:#237f88"/></marker><marker id="feedback-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" style="fill:#bc753b"/></marker></defs>
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#193449}.title{font-size:33px;font-weight:700}.subtitle{font-size:18px;fill:#536d7d}.section-title{font-size:23px;font-weight:700}.card-title{font-size:21px;font-weight:700}.body{font-size:19px}.support{font-size:15px}.section-bg{fill:#f4f8fb;stroke:#d8e5ec;stroke-width:2}.card-bg{fill:#fff;stroke:#b9cfdb;stroke-width:2}.blue{fill:#eaf1fc;stroke:#9ab4e1;stroke-width:2}.mint{fill:#e6f5ef;stroke:#80bdaa;stroke-width:2}.amber{fill:#fff2e3;stroke:#dfb079;stroke-width:2}.flow-line{fill:none;stroke:#237f88;stroke-width:3;marker-end:url(#arrow)}.feedback-line{fill:none;stroke:#bc753b;stroke-width:3;marker-end:url(#feedback-arrow)}.muted{fill:#5d7384}.orange{fill:#a76330}.teal{fill:#18796e}.divider{stroke:#dce7ed;stroke-width:2}</style>
<rect width="1400" height="1060" style="fill:#fff"/>
<text x="48" y="58" class="title">1.6　任務怎麼拆？先問未知資訊在哪裡</text>
<text x="48" y="91" class="subtitle">已知步驟與輸出用固定兩輪；依賴尚不清楚時，讓新證據改寫優先順序</text>
<g id="section-choice" class="section"><rect class="section-bg" x="40" y="118" width="1320" height="121" rx="21"/><g class="section-content"><text x="66" y="158" class="section-title">決策軸｜主要步驟與輸出，執行前是否已知？</text><text x="66" y="203" class="body">已知 → 固定提示鏈、便於驗證　　　　　　　未知 → 先盤點，按發現修訂任務清單</text></g></g>
<g id="section-fixed" class="section"><rect class="section-bg" x="40" y="259" width="640" height="603" rx="21"/><g class="section-content"><text x="67" y="300" class="section-title">已知結構｜固定兩輪審查</text><text x="67" y="330" class="support muted">例：付款改動涉及的檔案與檢查面向已知</text>
<path class="flow-line" d="M360 480V523"/>
<g id="concept-local" class="concept-card flow-node" data-title="第一輪逐檔局部分析" data-detail="對 checkout.py、billing.py、api.py 逐檔檢查自身邏輯、錯誤處理與修改點，保留檔案位置和證據。局部測試通過並不保證跨檔正確。"><rect class="card-bg blue" x="67" y="359" width="586" height="121" rx="16"/><g class="card-content"><text x="91" y="402" class="card-title">① 逐檔局部分析</text><text x="91" y="440" class="body">checkout.py・billing.py・api.py</text></g></g>
<g id="concept-integrate" class="concept-card flow-node" data-title="第二輪跨檔整合分析" data-detail="第二輪必須使用逐檔發現，沿介面及資料流檢查呼叫端與實作是否一致。本例 checkout 傳入的金額已是最小貨幣單位，billing 又乘以 100，導致多扣款。"><rect class="card-bg mint" x="67" y="523" width="586" height="141" rx="16"/><g class="card-content"><text x="91" y="567" class="card-title">② 跨檔整合分析</text><text x="91" y="605" class="body">沿介面核對資料流與金額單位</text><text x="91" y="639" class="support muted">第二輪依賴第一輪的介面與呼叫資訊</text></g></g>
<g id="concept-cross-file-failure" class="concept-card" data-title="局部通過仍可能整合錯誤" data-detail="checkout.py 已傳最小貨幣單位，billing.py 再乘以 100；即使逐檔測試各自通過，跨檔仍會多扣款。"><rect class="card-bg amber" x="67" y="704" width="586" height="116" rx="16"/><g class="card-content"><text x="91" y="748" class="card-title orange">局部都通過，整體仍可能出錯</text><text x="91" y="787" class="body">checkout 已是最小單位 → billing 再 ×100</text></g></g></g></g>
<g id="section-adaptive" class="section"><rect class="section-bg" x="720" y="259" width="640" height="603" rx="21"/><g class="section-content"><text x="747" y="300" class="section-title">未知依賴｜探索後回到清單重排</text><text x="747" y="330" class="support muted">例：舊程式庫要補哪些重要測試，起初沒有可靠地圖</text>
<path class="flow-line" d="M1020 431V459"/><path class="flow-line" d="M1020 553V581"/><path class="flow-line" d="M1020 693V721"/>
<g id="concept-map" class="concept-card flow-node" data-title="盤點模組與測試" data-detail="盤點 API 路由、orders、billing、現有測試和關鍵依賴；目前測試只覆蓋資料格式。"><rect class="card-bg blue" x="747" y="353" width="579" height="78" rx="15"/><g class="card-content"><text x="771" y="399" class="card-title">① 盤點結構：orders、billing 與現有測試</text></g></g>
<g id="concept-initial-list" class="concept-card flow-node" data-title="初始任務清單" data-detail="根據已知核心路徑與缺少的測試，初步清單先測 billing 金額邊界，再測 orders 下單流程。這個優先序可被新證據改寫。"><rect class="card-bg" x="747" y="459" width="579" height="94" rx="15"/><g class="card-content"><text x="771" y="500" class="card-title">② 初始清單</text><text x="771" y="532" class="body">先 billing 金額邊界 → 再 orders 下單</text></g></g>
<g id="concept-discovery" class="concept-card flow-node" data-title="新發現共用依賴" data-detail="調查 billing 時發現金額換算實際在共用模組 money，且 billing 與 orders 都依賴 money。新證據改變原本的相依圖，須回到任務清單重排。"><rect class="card-bg amber" x="747" y="581" width="579" height="112" rx="15"/><g class="card-content"><text x="771" y="624" class="card-title orange">③ 新發現：money 是共用依賴</text><text x="771" y="661" class="body">billing、orders 都用它 → 回清單重排</text></g></g>
<g id="concept-reordered-list" class="concept-card flow-node" data-title="修訂優先序後才執行" data-detail="新依賴使初始清單失效，須先修訂：先替 money 建立金額與幣別測試，再測 billing 與 orders 的整合；記錄調整原因並核對原始目標，之後才按新清單執行。"><rect class="card-bg mint" x="747" y="721" width="579" height="99" rx="15"/><g class="card-content"><text x="771" y="762" class="card-title teal">④ 修訂清單後執行</text><text x="771" y="796" class="body">先測 money → 再測 billing、orders 整合</text></g></g>
</g></g>
<g id="section-principle" class="section"><rect class="section-bg" x="40" y="883" width="1320" height="131" rx="21"/><g class="section-content"><text x="66" y="923" class="section-title">共同原則｜子任務要有輸入、輸出與完成條件</text><text x="66" y="964" class="body">切太碎增加交接；切太粗難以驗證。先用探索消除真正未知，再固定已確定的局部工作。</text></g></g>
</svg>
