<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" role="img" aria-label="以測試、具體失敗與回歸驗證形成修正迴圈">
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#19344b}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#536a7b}.h{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.section-bg{fill:#f7f7f2;stroke:#e2dfd0;stroke-width:2}.card-bg{fill:#fff;stroke:#d3d0bc;stroke-width:2}.flow-line{fill:none;stroke:#9b7741;stroke-width:3;marker-end:url(#arrow)}.accent{fill:#895c1d;font-weight:700}.bad{fill:#a84737;font-weight:700}.good{fill:#176e66;font-weight:700}</style><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" style="fill:none;stroke:#9b7741;stroke-width:2;stroke-linejoin:round"/></marker><marker id="green-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" style="fill:none;stroke:#176e66;stroke-width:2;stroke-linejoin:round"/></marker></defs>
<rect width="1200" height="1030" fill="white"/><text x="48" y="59" class="title">3.5　迭代不是「再改好一點」</text><text x="48" y="91" class="sub">每輪都要能指出預期、實際差距，以及修正後的再驗證。</text>
<g id="section-contract" class="section"><rect class="section-bg" x="40" y="125" width="1120" height="200" rx="22"/><g class="section-content"><text x="64" y="161" class="h">先把模糊要求轉成可測契約</text>
<g id="concept-normal" class="concept-card" data-title="正常案例" data-detail="name 為前後有空白的 Ada、age 為字串 28 時，預期去空白並轉成數字。"><rect class="card-bg" x="64" y="184" width="330" height="112" rx="15"/><g class="card-content"><text x="86" y="219" class="body accent">正常</text><text x="86" y="250" class="small">" Ada "、"28"</text><text x="86" y="275" class="small">→ "Ada"、28</text></g></g>
<g id="concept-null" class="concept-card" data-title="邊界案例" data-detail="age 為 null 時預期仍為 null，不應猜成零。"><rect class="card-bg" x="434" y="184" width="330" height="112" rx="15"/><g class="card-content"><text x="456" y="219" class="body accent">邊界</text><text x="456" y="250" class="small">age: null</text><text x="456" y="275" class="small">→ 保留 null，不猜零</text></g></g>
<g id="concept-invalid" class="concept-card" data-title="錯誤與效能" data-detail="空姓名應回 name_required；百萬筆處理若有時限與記憶體上限，也須明確列出測量條件。"><rect class="card-bg" x="804" y="184" width="330" height="112" rx="15"/><g class="card-content"><text x="826" y="219" class="body accent">錯誤與效能</text><text x="826" y="250" class="small">空姓名 → name_required</text><text x="826" y="275" class="small">大量資料另定耗時上限</text></g></g></g></g>
<g id="section-loop" class="section"><rect class="section-bg" x="40" y="345" width="1120" height="288" rx="22"/><g class="section-content"><text x="64" y="382" class="h">測試先行的修正迴圈</text>
<path class="flow-line" d="M323 497H414"/><path class="flow-line" d="M692 497H783"/><path class="flow-line" d="M940 565V591H553V565"/><text x="754" y="620" class="small">仍失敗 → 回到差距定位</text><path class="flow-line" style="stroke:#176e66;marker-end:url(#green-arrow)" d="M1060 565V588"/><rect x="990" y="591" width="144" height="31" rx="10" style="fill:#e6f5ed;stroke:#176e66;stroke-width:1.5"/><text x="1005" y="612" class="small good">通過 → 交付</text>
<g id="concept-test" class="concept-card flow-node" data-title="先定預期" data-detail="先寫或確認正常、邊界與效能測試；避免重複既有測試。"><rect class="card-bg" x="64" y="423" width="260" height="142" rx="16"/><g class="card-content"><text x="86" y="461" class="h">① 先定預期</text><text x="86" y="498" class="body">測試與驗收條件</text><text x="86" y="532" class="small">正常／邊界／效能</text></g></g>
<g id="concept-evidence" class="concept-card flow-node" data-title="提出具體失敗" data-detail="回饋失敗輸入、預期、實際輸出與錯誤訊息，不要只說空值處理不對。"><rect class="card-bg" x="414" y="423" width="279" height="142" rx="16"/><g class="card-content"><text x="436" y="461" class="h">② 提出差距</text><text x="436" y="498" class="body">輸入／預期／實際</text><text x="436" y="532" class="small bad">null → 0 是明確失敗</text></g></g>
<g id="concept-regression" class="concept-card flow-node" data-title="修正與回歸" data-detail="只針對可定位差距修正，再跑受影響測試及必要回歸測試；若破壞舊行為，回到契約釐清。"><rect class="card-bg" x="783" y="423" width="351" height="142" rx="16"/><g class="card-content"><text x="805" y="461" class="h">③ 修正並重跑</text><text x="805" y="498" class="body">相關案例 + 回歸測試</text><text x="805" y="532" class="small good">驗證新修正沒有破壞舊行為</text></g></g></g></g>
<g id="section-branch" class="section"><rect class="section-bg" x="40" y="653" width="1120" height="154" rx="22"/><g class="section-content"><text x="64" y="690" class="h">遇到未知規則，先訪談；已有失敗測試，直接修正</text>
<g id="concept-interview" class="concept-card" data-title="訪談分支" data-detail="快取失效、資料一致性、舊系統停寫時間等未定事項，先讓 Claude 提問；回答後轉成可驗證設計條件。"><rect class="card-bg" x="64" y="711" width="520" height="72" rx="13"/><g class="card-content"><text x="86" y="755" class="body">規則未定／衝突 → 提問 → 更新契約</text></g></g>
<g id="concept-direct-fix" class="concept-card" data-title="修正分支" data-detail="當已有契約與失敗測試，無須再做泛泛訪談；提供具體差距，修正後重跑。"><rect class="card-bg" x="611" y="711" width="523" height="72" rx="13"/><g class="card-content"><text x="633" y="755" class="body">規則已定 → 用失敗證據修正</text></g></g></g></g>
<g id="section-feedback" class="section"><rect class="section-bg" x="40" y="827" width="1120" height="172" rx="22"/><g class="section-content"><text x="64" y="863" class="h">回饋如何分輪：先看問題是否相依</text>
<g id="concept-dependent" class="concept-card" data-title="相依問題同輪" data-detail="若空值處理影響報表計數，兩者共享原因與驗收條件，應同輪描述，避免修一處又打壞另一處。"><rect class="card-bg" x="64" y="882" width="520" height="91" rx="13"/><g class="card-content"><text x="86" y="917" class="body accent">相依 → 同輪回饋</text><text x="86" y="951" class="small">例：null 處理 + 報表計數，一起驗證</text></g></g>
<g id="concept-independent" class="concept-card" data-title="獨立問題分輪" data-detail="若介面排版與大量資料效能互不影響，分輪處理較容易定位成效與回歸。"><rect class="card-bg" x="611" y="882" width="523" height="91" rx="13"/><g class="card-content"><text x="633" y="917" class="body accent">獨立 → 分輪修正</text><text x="633" y="951" class="small">例：介面排版與大量資料效能分開測</text></g></g></g></g>
</svg>
