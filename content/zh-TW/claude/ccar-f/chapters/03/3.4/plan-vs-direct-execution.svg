<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" role="img" aria-label="計畫模式與直接執行的決策樹">
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#16344a}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#576879}.h{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.section-bg{fill:#f6f8fc;stroke:#d9e0ed;stroke-width:2}.card-bg{fill:#fff;stroke:#bdcbdc;stroke-width:2}.flow-line{fill:none;stroke:#566e9b;stroke-width:3;marker-end:url(#arrow)}.yes{fill:#a24539;font-weight:700}.ok{fill:#116b73;font-weight:700}</style><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" style="fill:none;stroke:#566e9b;stroke-width:2;stroke-linejoin:round"/></marker></defs>
<rect width="1200" height="1180" fill="white"/><text x="48" y="60" class="title">3.4　未知決策多，就先計畫</text><text x="48" y="92" class="sub">模式選擇取決於動手前的未知，而非「改程式」這個任務名稱。</text>
<g id="section-gate" class="section"><rect class="section-bg" x="40" y="125" width="1120" height="287" rx="22"/><g class="section-content"><text x="64" y="162" class="h">開始前問四件事</text>
<g id="concept-scope" class="concept-card" data-title="範圍是否已知" data-detail="單一函式與清楚堆疊追蹤可直接執行；跨多檔依賴未知應先探索。"><rect class="card-bg" x="64" y="184" width="520" height="88" rx="14"/><g class="card-content"><text x="88" y="220" class="body">① 影響範圍與依賴已查清？</text><text x="88" y="249" class="small">單一函式或跨模組？</text></g></g>
<g id="concept-options" class="concept-card" data-title="方案是否需比較" data-detail="若存在多個合理整合方式，牽涉基礎設施、資料遷移或團隊介面，先比較取捨。"><rect class="card-bg" x="616" y="184" width="518" height="88" rx="14"/><g class="card-content"><text x="640" y="220" class="body">② 有多個合理實作方案？</text><text x="640" y="249" class="small">介面、資料與基礎設施取捨</text></g></g>
<g id="concept-revert" class="concept-card" data-title="後果是否難回退" data-detail="大規模遷移與格式契約變動需要事先定驗收與回退條件。"><rect class="card-bg" x="64" y="293" width="520" height="88" rx="14"/><g class="card-content"><text x="88" y="329" class="body">③ 改動是否難以回退？</text><text x="88" y="358" class="small">架構邊界、資料格式、批次遷移</text></g></g>
<g id="concept-explore" class="concept-card" data-title="探索輸出是否龐大" data-detail="大量搜尋與讀檔可由 Explore 子代理摘要呼叫點與證據路徑，主會話仍應核對關鍵結論。"><rect class="card-bg" x="616" y="293" width="518" height="88" rx="14"/><g class="card-content"><text x="640" y="329" class="body">④ 探索輸出會淹沒主會話？</text><text x="640" y="358" class="small">Explore 隔離搜尋，回傳證據路徑</text></g></g></g></g>
<path class="flow-line" d="M600 414V446H307V473"/><path class="flow-line" d="M600 446H901V473"/>
<text x="135" y="458" class="small ok">少未知、易驗證</text><text x="944" y="458" class="small yes">多未知、難回退</text>
<g id="section-direct" class="section"><rect class="section-bg" x="40" y="472" width="529" height="220" rx="22"/><g class="section-content"><text x="64" y="512" class="h ok">直接執行</text><g id="concept-direct" class="concept-card flow-node" data-title="直接修正並測試" data-detail="validateDate 對空字串的預期明確時，讀函式與測試、修正、跑測試；若發現相容性依賴，轉回規劃。"><rect class="card-bg" x="64" y="534" width="481" height="128" rx="15"/><g class="card-content"><text x="88" y="572" class="body">例：validateDate("") 單點修正</text><text x="88" y="605" class="small">讀取 → 修改 → 測試</text><text x="88" y="635" class="small">若查出隱藏依賴，再切換模式</text></g></g></g></g>
<g id="section-plan" class="section"><rect class="section-bg" x="591" y="472" width="569" height="220" rx="22"/><g class="section-content"><text x="615" y="512" class="h yes">計畫模式</text><g id="concept-plan" class="concept-card flow-node" data-title="先調查再實作" data-detail="45 個檔案換驗證函式庫時，先查呼叫點、錯誤格式契約、遷移順序、回退與每批測試；確認方案後才逐批實作。"><rect class="card-bg" x="615" y="534" width="519" height="128" rx="15"/><g class="card-content"><text x="639" y="572" class="body">例：45 檔驗證函式庫遷移</text><text x="639" y="605" class="small">查依賴 → 比方案 → 定驗收與回退</text><text x="639" y="635" class="small">確認後再逐批執行與驗證</text></g></g></g></g>
<g id="section-plan-cycle" class="section"><rect class="section-bg" x="40" y="713" width="1120" height="425" rx="20"/><g class="section-content">
<text x="64" y="752" class="h">進入計畫模式後：審核是閘門，假設失效就回到調查</text>
<path class="flow-line" d="M310 853H332"/><path class="flow-line" d="M574 853H596"/><path class="flow-line" d="M838 853H900"/><text x="849" y="840" class="small">核准</text>
<g id="concept-investigate" class="concept-card flow-node" data-title="只讀探索與 Explore 子代理" data-detail="先查影響範圍、依賴與替代方案。搜尋量大時用 Explore 子代理收摘要和證據路徑；主會話仍核對關鍵證據。"><rect class="card-bg" x="64" y="789" width="246" height="129" rx="14"/><g class="card-content"><text x="84" y="827" class="h">① 調查依賴</text><text x="84" y="864" class="body">必要時交 Explore</text><text x="84" y="895" class="small">只讀探索，保留證據</text></g></g>
<g id="concept-draft-plan" class="concept-card flow-node" data-title="計畫列出驗收與假設" data-detail="計畫須寫出變更範圍、順序、維持不變的契約、逐批測試與回退、仍未確認的假設；不能把未知當已確定。"><rect class="card-bg" x="332" y="789" width="242" height="129" rx="14"/><g class="card-content"><text x="352" y="827" class="h">② 擬定計畫</text><text x="352" y="864" class="body">範圍／驗收／回退</text><text x="352" y="895" class="small">標明未驗假設</text></g></g>
<g id="concept-human-review" class="concept-card flow-node" data-title="人工核准閘門" data-detail="審核者核對意圖與範圍、路徑與相依、風險與驗收；可核准、修改後核准或拒絕。核准不是計畫永遠正確的證明。"><rect class="card-bg" x="596" y="789" width="242" height="129" rx="14" style="fill:#edf4fa"/><g class="card-content"><text x="616" y="827" class="h">③ 人工審核</text><text x="616" y="864" class="body">核准／修訂／拒絕</text><text x="616" y="895" class="small">範圍、相依、風險</text></g></g>
<g id="concept-execute-batches" class="concept-card flow-node" data-title="按核准範圍分批執行" data-detail="核准後按計畫逐批修改、測試與記錄結果；不能因遇到新線索就默默加入未核准的跨領域改動。"><rect class="card-bg" x="900" y="789" width="234" height="129" rx="14" style="fill:#ebf7ef"/><g class="card-content"><text x="920" y="827" class="h">④ 分批執行</text><text x="920" y="864" class="body">每批驗證不變條件</text><text x="920" y="895" class="small">只做已核准範圍</text></g></g>
<path class="flow-line" d="M717 918V974H453V927"/>
<text x="479" y="963" class="small">審核退回 → 修改計畫，再審</text>
<path class="flow-line" d="M1017 918V1061H187V927"/>
<text x="288" y="1049" class="small">多階段假設失效 → 暫停擴大寫入、重新探索並重審</text>
<text x="64" y="1106" class="small">若僅局部步驟受影響：修訂該步並重測；直接執行中發現跨模組相容性問題，也應切回計畫。</text>
</g></g>
</svg>
